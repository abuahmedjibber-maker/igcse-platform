{id:"l6",t:"Interview with a Marine Biologist",topic:"Environment",lvl:"Higher",m:11,
intro:"You will hear an interview with a marine biologist about coral reefs.",
script:`Interviewer: Doctor Reyes, is it fair to say the reef is dying?
Doctor Reyes: I wouldn't put it quite like that. Parts of it are under severe stress, certainly. But 'dying' suggests a process nobody can stop, and that isn't what the evidence shows.
Interviewer: What does the evidence show?
Doctor Reyes: That recovery is possible, but only where two conditions are met. First, water temperature has to stabilise. Second — and this is the part people forget — local pressures have to be reduced. Overfishing, sediment from construction, waste water. A reef fighting warming and pollution at the same time has very little chance. A reef fighting warming alone often recovers.
Interviewer: So local action matters even though the temperature problem is global?
Doctor Reyes: That's exactly the point I try to make. People hear 'climate' and assume there's nothing a coastal town can do. In fact the local decisions are the ones that determine whether a reef survives long enough for the global picture to improve.
Interviewer: And are you optimistic?
Doctor Reyes: Cautiously. I've watched two reefs recover in fifteen years. I've also watched three disappear. What separated them wasn't luck.`,
qs:[
{type:"mcq",q:"How does Doctor Reyes respond to the word 'dying'?",o:["She agrees fully","She politely disagrees and reframes it","She refuses to answer","She becomes angry"],a:1,e:"'I wouldn't put it quite like that' is polite disagreement, followed by a more precise version."},
{type:"mcq",q:"How many conditions does she say are needed for recovery?",o:["One","Two","Three","Four"],a:1,e:"Stable water temperature AND reduced local pressures."},
{type:"mcq",q:"Which local pressures does she mention?",o:["Tourism and diving","Overfishing, sediment and waste water","Shipping and noise","Fishing only"],a:1,e:"She lists overfishing, sediment from construction, and waste water."},
{type:"mcq",q:"What is her main message about local action?",o:["It makes no difference","It determines whether a reef survives long enough for global conditions to improve","It matters more than climate","It is too expensive"],a:1,e:"'the local decisions are the ones that determine whether a reef survives long enough'."},
{type:"mcq",q:"'What separated them wasn't luck.' She implies that…",o:["the outcome was random","human decisions made the difference","the reefs were identical","nothing can be done"],a:1,e:"Rejecting luck implies the difference was caused by what people did."},
{type:"mcq",q:"Her overall attitude is best described as…",o:["pessimistic","cautiously optimistic","indifferent","certain of success"],a:1,e:"She says 'cautiously' and balances two recoveries against three losses."}
]}
];

{id:"w1",type:"Informal email",t:"A school trip",words:[150,200],reg:"Informal",
brief:"You recently went on a school trip. Write an email to your friend Omar about it.",
bullets:["describe where you went and what you did","explain one thing that went wrong","invite Omar to come with you next year"],

model:`Hi Omar,

I've been meaning to write since Friday — you missed an unbelievable trip.

We went to the old harbour museum, which honestly sounded boring when Mr Karim announced it. It wasn't. They let us handle actual objects from a shipwreck, and I held a coin that had been under water for three hundred years. I keep thinking about the last person who touched it before me.

{id:"w2",type:"Formal letter",t:"A complaint about a course",words:[150,200],reg:"Formal",
brief:"You attended a weekend course that was not as advertised. Write a letter to the course director.",
bullets:["explain which course you attended and when","describe TWO ways it differed from the advertisement","say clearly what you would like to be done"],

model:`Dear Sir or Madam,

I am writing to express my dissatisfaction with the Introduction to Photography course held on 14 and 15 March, for which I paid the full fee of £120.

The advertisement stated that the course would be limited to twelve participants. In fact, twenty-six people attended, which meant that individual guidance was almost impossible; I received approximately two minutes of the tutor's attention over the entire weekend.

Furthermore, the advertised practical session on outdoor lighting did not take place. We were informed on the Saturday morning that the equipment was unavailable, and the time was filled with an additional lecture instead. This session was the principal reason I enrolled.

{id:"w3",type:"Article",t:"Should phones be banned in school?",words:[150,200],reg:"Semi-formal / lively",
brief:"Write an article for your school magazine giving your views on banning mobile phones in school.",
bullets:["outline the arguments in favour of a ban","outline the arguments against","give and justify your own opinion"],
plan:["Hook — question or vivid image","Arguments for the ban","Arguments against","Your view + a memorable ending"],
checklist:["A short, engaging title","Direct address or a rhetorical question","BOTH sides genuinely presented","A clear personal opinion, justified","Varied connectives (however, furthermore, consequently)","150–200 words"],
model:`Phones in School: Tool or Trap?

Count how many times you check your phone in one lesson. Now double it — because you almost certainly under-counted.

Those in favour of a ban have a strong case. A phone on a desk fragments attention even when it is face down, and teachers describe the constant, quiet competition for students' focus. There is also the uncomfortable question of what happens in the photographs taken in corridors.

Yet a total ban ignores something important. Many of us use our phones to photograph the board, translate unfamiliar vocabulary, and check the bus home. For students who travel long distances, a phone is a safety line rather than a toy.

My own view is that the argument has been framed wrongly. The question is not whether phones should exist in school, but whether we are ever taught to use them well. Ban them entirely and we simply postpone the problem to university.

So before we confiscate, perhaps we should teach.`},

{id:"w4",type:"Report",t:"The school library",words:[150,200],reg:"Formal",
brief:"Your head teacher has asked you to report on how students use the school library. Write the report.",
bullets:["describe how the library is currently used","identify TWO problems","recommend improvements"],
plan:["Purpose of the report","Findings — usage","Problems identified","Recommendations"],
checklist:["Neutral, factual tone","No personal stories or jokes","Evidence-style language (the survey revealed…)","TWO clear problems","At least one specific recommendation","150–200 words"],
model:`Report on the Use of the School Library

Purpose
This report examines how students currently use the school library and recommends improvements.

Findings
A survey of eighty students revealed that the library is busiest between 12:30 and 13:15, when approximately forty students attempt to use twenty-four seats. Usage after school is minimal, with fewer than six students present on a typical day.

Problems
Two difficulties emerged clearly. Firstly, seating is insufficient at peak times, and a significant number of students reported leaving without finding a place. Secondly, the library closes at 15:30, which is before many students finish extra-curricular activities.

Recommendations
I would recommend that opening hours be extended to 17:00 on at least three days each week, and that the study area be reorganised to provide an additional twelve seats. It would also be advisable to designate the smaller room for silent study, since noise was the most frequent complaint recorded.`},

{id:"w5",type:"Review",t:"A place you visited",words:[150,200],reg:"Semi-formal",
brief:"Write a review of a café, restaurant or place of interest for a travel website.",
bullets:["describe what the place is like","give your opinion on two aspects","say who would enjoy it and who would not"],
plan:["What and where — one sentence","Strength, with a specific detail","Weakness, honestly stated","Recommendation — who it suits"],
checklist:["Description AND evaluation, not just description","At least one specific sensory detail","A genuine criticism (a review that praises everything is not trusted)","A clear recommendation naming who it suits","150–200 words"],
model:`The Blue Door Café — Worth the Queue, Just

Tucked down a side street behind the old post office, the Blue Door looks like nothing at all from outside: eight tables, a hand-painted sign, and a queue that starts forming at half past eleven.

The food justifies the wait. The lentil soup arrives almost too hot to hold, thick enough to stand a spoon in, and the bread is baked in the kitchen you can see from every seat. At the equivalent of three pounds for lunch, it is remarkable value.

Service is the weak point. With one person cooking and serving, a busy Saturday means waiting twenty minutes even after you have sat down, and nobody comes to explain the delay. If you are in a hurry, this is not your café.

I would recommend it warmly to anyone travelling alone or in a pair with an unhurried afternoon ahead. Families with restless young children should probably walk on.`},

{id:"w6",type:"Formal letter",t:"An application",words:[150,200],reg:"Formal",
brief:"You have seen an advertisement for a summer volunteer position at a local museum. Write a letter of application.",
bullets:["say which position you are applying for and where you saw it","describe relevant experience and qualities","explain why you want the position"],
plan:["Purpose + source of the advertisement","Relevant experience","Personal qualities + why you want it","Availability + polite close"],
checklist:["States position AND where it was advertised","Positive throughout — no criticism of your school","Specific evidence, not vague claims","Formal request and correct sign-off","150–200 words"],
model:`Dear Ms Haddad,

I am writing to apply for the position of summer volunteer guide at the City Museum, advertised in the Riverside Gazette on 3 May.

I am currently in my final year of secondary school, where I have studied history for four years and completed a project on the harbour's trading history which was displayed at our school open evening. Through that project I spent two weeks working with your archive department, so I am already familiar with the collection and with the standards of care it requires.

I would describe myself as patient and comfortable speaking to groups. For the past two years I have helped run our school's reading club for younger students, which has taught me a great deal about explaining unfamiliar ideas simply.

I am particularly keen to join the museum because I would like to study museum studies at university, and practical experience matters far more than any certificate.

I am available from 1 July until 28 August and would welcome the opportunity of an interview.

Yours sincerely,
K. Ibrahim`},

{id:"w7",type:"Informal email",t:"Giving advice",words:[150,200],reg:"Informal",
brief:"Your cousin has written to say she is nervous about starting a new school. Write back.",
bullets:["reassure her about how you felt in the same situation","give TWO pieces of practical advice","suggest something you could do together"],
plan:["Warm opening + acknowledge how she feels","Your own experience","Advice one and advice two","A suggestion + friendly close"],
checklist:["Warm, informal tone","Empathy before advice","TWO clear pieces of advice","Advice structures (why don't you…, it might help to…, if I were you…)","A concrete suggestion at the end","150–200 words"],
model:`Hi Rania,

Your message arrived at exactly the right moment, because I remember that feeling far too well.

When I changed schools two years ago I was convinced that everyone already knew each other and that I would spend the whole year eating lunch alone. I did, for about four days. Then someone asked me where I was from and that was that. It genuinely passes faster than you expect.

Two things helped me, so I'll pass them on. First, join something in the first week — anything at all, even if it isn't really your interest. Clubs are far easier places to talk than corridors. Second, learn five names properly rather than twenty badly; people notice when you remember them.

If I were you I'd also stop imagining the worst afternoon in advance. You're much better at this than you think.

Come and stay in the holidays and tell me how it went — I'll cook, badly, as usual.

Love,
Nadia`},

{id:"w8",type:"Article",t:"Is social media good for young people?",words:[150,200],reg:"Semi-formal / lively",
brief:"Write an article for a youth website giving your views on the effect of social media on young people.",
bullets:["describe the benefits","describe the problems","give your own balanced conclusion"],
plan:["Hook","Benefits — with a specific example","Problems — hedged, not sweeping","Balanced conclusion"],
checklist:["Engaging title and opening","Hedged language (may, tend to, in some cases)","At least one specific example","Both sides, then a genuine conclusion","150–200 words"],
model:`Scroll, Compare, Repeat?

Ask an adult about social media and you will usually hear one word: dangerous. Ask someone our age and the answer is more complicated — because for us it is not an app, it is where our friendships live.

The benefits are real and easily forgotten. My cousin moved abroad four years ago and I have watched her grow up in a way my parents' generation simply could not have done. Young people organise, learn and find others like themselves in ways that were impossible twenty years ago.

The costs, however, are equally real. Constant comparison may contribute to anxiety in some users, and there is good evidence that late-night use damages sleep — which in turn damages everything else.

My conclusion is not that social media is good or bad, but that it is powerful, and we are handed it at thirteen with no instructions at all. What we need is not a ban. It is the honesty to admit when it is making us miserable, and the discipline to put it down.`}
];

/* ---------- confetti ---------- */
var cvE,cxE,parts=[],anim=null;
function confetti(n){
  cvE=$("cv");cxE=cvE.getContext("2d");cvE.width=innerWidth;cvE.height=innerHeight;
  var cols=["#4f46e5","#6366f1","#f59e0b","#10b981","#ef4444","#0ea5e9"];
  for(var i=0;i<(n||90);i++)parts.push({x:Math.random()*cvE.width,y:-20-Math.random()*cvE.height*.4,
    w:6+Math.random()*6,h:8+Math.random()*9,c:cols[(Math.random()*cols.length)|0],
    vy:2+Math.random()*4,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4});
  if(!anim)anim=requestAnimationFrame(drawC);
}
function drawC(){
  cxE.clearRect(0,0,cvE.width,cvE.height);
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cxE.save();cxE.translate(p.x,p.y);cxE.rotate(p.r);cxE.fillStyle=p.c;cxE.fillRect(-p.w/2,-p.h/2,p.w,p.h);cxE.restore();
    if(p.y>cvE.height+30)parts.splice(i,1);}
  if(parts.length)anim=requestAnimationFrame(drawC);else{anim=null;cxE.clearRect(0,0,cvE.width,cvE.height);}
}

function touchStreak(){
  var t=today();

  var y=new Date();y.setDate(y.getDate()-1);
  var yk=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  DB.streak.days=(DB.streak.last===yk)?DB.streak.days+1:1;
  DB.streak.last=t;

  save();
}

/* ---------- progress model ---------- */
function totalLessons(){var n=0;for(var i=0;i<COURSE.length;i++)n+=COURSE[i].lessons.length;return n;}
function doneLessons(){var n=0;for(var k in DB.lessons)if(DB.lessons[k]&&DB.lessons[k].done)n++;return n;}
function unitDone(u){var n=0;for(var i=0;i<u.lessons.length;i++){var r=DB.lessons[u.lessons[i].id];if(r&&r.done)n++;}return n;}

function skillStats(){
  var s={
    reading:{d:Object.keys(DB.reading).length,t:READING.length,ic:"📖",n:"Reading"},
    listening:{d:Object.keys(DB.listening).length,t:LISTENING.length,ic:"🎧",n:"Listening"},
    speaking:{d:Object.keys(DB.speaking).length,t:SPEAKING.length,ic:"🗣️",n:"Speaking"},
    writing:{d:Object.keys(DB.writing).length,t:WRITING.length,ic:"✍️",n:"Writing"},
    course:{d:doneLessons(),t:totalLessons(),ic:"📚",n:"Course"},
    vocab:{d:vocabLearned(),t:vocabTotal(),ic:"💡",n:"Vocabulary"}
  };
  return s;
}
function vocabTotal(){var n=0;for(var i=0;i<VOCAB.length;i++)n+=VOCAB[i].words.length;return n;}
function vocabLearned(){var n=0;for(var k in DB.vocab)if(DB.vocab[k]&&DB.vocab[k].box>=3)n++;return n;}

function overallPct(){
  var s=skillStats(),tot=0,got=0;
  for(var k in s){tot+=s[k].t;got+=Math.min(s[k].d,s[k].t);}
  return pct(got,tot);
}

var VIEW="home",VPARAM=null,HIST=[];
function go(v,p,noPush){
  if(!DB.name&&v!=="welcome"){v="welcome";}

  stopAllMedia();
  VIEW=v;VPARAM=p||null;

  for(var i=0;i<vs.length;i++)vs[i].classList.add("hide");
  var el=$("v-"+v); if(el)el.classList.remove("hide");
  var nav=document.querySelectorAll("[data-v]");
  var top=({lesson:"learn",reading:"practice",listening:"practice",speaking:"practice",
            writing:"practice",drill:"practice",cards:"vocab",exam:"exams"})[v]||v;
  for(var i=0;i<nav.length;i++)nav[i].classList.toggle("on",nav[i].dataset.v===top);
  window.scrollTo(0,0);
  RENDER[v]&&RENDER[v](p);

/* ---------- quiz renderer (shared) ---------- */
function renderQuiz(qs,mount,onDone,idPrefix){
  var state={i:0,correct:0,answered:[]};
  function draw(){
    if(state.i>=qs.length){
      var p=pct(state.correct,qs.length);
      mount.innerHTML='<div class="card" style="text-align:center">'+
        '<div style="font-size:44px">'+(p>=80?"🎉":p>=50?"👍":"📚")+'</div>'+
        '<h3 style="margin:6px 0">'+state.correct+' / '+qs.length+' correct</h3>'+
        '<p class="sub">'+(p>=80?"Excellent work.":p>=50?"Solid — review the ones you missed.":"Read the explanations carefully, then try again.")+'</p>'+
        bar(p)+'</div>';
      if(p===100)grant("perfect");
      onDone&&onDone(p,state.correct,qs.length);
      return;
    }
    var q=qs[state.i],h='';
    h+='<div class="between" style="margin-bottom:10px"><span class="pill p">Question '+(state.i+1)+' of '+qs.length+'</span>'+
       '<span class="pill">'+state.correct+' correct</span></div>';
    h+=bar(Math.round(state.i/qs.length*100));
    h+='<div class="q" style="margin-top:14px"><div class="qt">'+q.q+'</div>';
    if(q.type==="short"){
      h+='<input class="inp" id="'+idPrefix+'in" placeholder="Type your answer…" autocomplete="off" '+
         'onkeydown="if(event.key===\'Enter\')document.getElementById(\''+idPrefix+'go\').click()">'+
         '<button class="btn pri sm" style="margin-top:10px;width:auto;padding:10px 18px" id="'+idPrefix+'go">Check answer</button>';
    }else{
      h+='<div class="opts">';
      for(var i=0;i<q.o.length;i++)
        h+='<button class="opt" data-i="'+i+'"><span class="k">'+"ABCDE"[i]+'</span><span>'+q.o[i]+'</span></button>';
      h+='</div>';
    }
    h+='<div id="'+idPrefix+'fb"></div></div>';
    mount.innerHTML=h;
    if(q.type==="short"){
      $(idPrefix+"go").onclick=function(){
        var v=norm($(idPrefix+"in").value);
        if(!v){toast("Type an answer first");return;}
        var ok=false;for(var j=0;j<q.ans.length;j++)if(norm(q.ans[j])===v||(v.length>3&&norm(q.ans[j]).indexOf(v)>=0))ok=true;
        $(idPrefix+"in").disabled=true;this.disabled=true;
        reveal(ok,q);
      };
      setTimeout(function(){try{$(idPrefix+"in").focus();}catch(e){}},200);
    }else{
      var bs=mount.querySelectorAll(".opt");
      for(var i=0;i<bs.length;i++)(function(b,idx){
        b.onclick=function(){
          for(var j=0;j<bs.length;j++){bs[j].style.pointerEvents="none";
            if(j===q.a)bs[j].classList.add(idx===q.a?"ok":"rev");
            if(j===idx&&idx!==q.a)bs[j].classList.add("no");}
          reveal(idx===q.a,q);
        };
      })(bs[i],i);
    }
  }
  function reveal(ok,q){
    if(ok)state.correct++;
    state.answered.push(ok);
    var ans=q.type==="short"?("Answer: <b>"+esc(q.ans[0])+"</b><br>"):"";
    $(idPrefix+"fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"✅ Correct":"❌ Not quite")+'</b>'+
      (ok?"":ans)+esc(q.e)+'</div>'+
      '<button class="btn pri" style="margin-top:12px" onclick="__next'+idPrefix+'()">'+
      (state.i+1>=qs.length?"See result":"Next question →")+'</button>';
    window["__next"+idPrefix]=function(){state.i++;draw();};
  }
  draw();
}
function norm(s){return String(s).toLowerCase().replace(/[.,!?;:"'£$]/g,"").replace(/\s+/g," ").trim();}

function dueCards(){
  var now=Date.now(),out=[];
  for(var i=0;i<VOCAB.length;i++)for(var j=0;j<VOCAB[i].words.length;j++){
    var w=VOCAB[i].words[j],c=DB.vocab[w[0]];
    if(c&&c.due<=now&&c.box<5)out.push({w:w,set:VOCAB[i]});
  }
  return out;
}
var CARDS={list:[],i:0,flip:false};
RENDER.cards=function(id){
  var list=[];
  if(id==="due"){var d=dueCards();for(var i=0;i<d.length;i++)list.push(d[i].w);}
  else{var v=byId(VOCAB,id);if(!v){go("vocab");return;}list=v.words.slice();}
  if(!list.length){go("vocab");return;}
  CARDS={list:list,i:0,flip:false,title:id==="due"?"Review":(byId(VOCAB,id)||{}).t};
  drawCard();
};
function drawCard(){
  if(CARDS.i>=CARDS.list.length){
    $("v-cards").innerHTML=backBtn()+'<div class="card" style="text-align:center"><div style="font-size:44px">✅</div>'+
      '<h3 style="margin:8px 0">Set complete</h3><p class="sub">'+CARDS.list.length+' cards reviewed. Words you marked as difficult will return sooner.</p>'+
      '<button class="btn pri" style="margin-top:12px" onclick="go(\'vocab\')">Back to Vocabulary</button></div>';
    confetti(50);checkBadges();addXP(10);return;
  }
  var w=CARDS.list[CARDS.i];
  $("v-cards").innerHTML=backBtn()+
   '<div class="between" style="margin-bottom:10px"><span class="pill p">'+esc(CARDS.title||"Cards")+'</span>'+
   '<span class="pill">'+(CARDS.i+1)+' / '+CARDS.list.length+'</span></div>'+
   bar(Math.round(CARDS.i/CARDS.list.length*100))+
   '<div class="fcard'+(CARDS.flip?" flip":"")+'" id="fc" onclick="flipCard()">'+
     '<div class="in"><div class="f"><div><div class="w">'+esc(w[0])+'</div>'+
     '<p class="tiny" style="margin-top:14px">Tap to reveal the meaning</p></div></div>'+
     '<div class="b"><div><div class="d">'+esc(w[1])+'</div></div></div></div></div>'+
   (CARDS.flip?
     '<p class="sub" style="text-align:center;margin:6px 0 10px">How well did you know it?</p>'+
     '<div class="row"><button class="btn dg" onclick="gradeCard(0)">Again</button>'+
     '<button class="btn" onclick="gradeCard(1)">Hard</button>'+
     '<button class="btn ok" onclick="gradeCard(2)">Easy</button></div>'
     :'<button class="btn pri" style="margin-top:6px" onclick="flipCard()">Show meaning</button>');
}
function flipCard(){CARDS.flip=!CARDS.flip;drawCard();}
function gradeCard(g){
  var w=CARDS.list[CARDS.i][0];
  var c=DB.vocab[w]||{box:0,due:0};
  if(g===0)c.box=Math.max(0,c.box-1);
  else if(g===1)c.box=c.box;
  else c.box=Math.min(5,c.box+1);
  var days=[0,1,2,4,8,16][c.box]||0;
  c.due=Date.now()+days*86400000;
  DB.vocab[w]=c;save();
  CARDS.i++;CARDS.flip=false;drawCard();
  if(g===2)addXP(2);
}

function pickVoice(){
  if(!window.speechSynthesis)return null;
  var vs=speechSynthesis.getVoices()||[];
  var pref=["Google UK English Female","Google UK English Male","Microsoft Libby","Microsoft Sonia","Daniel","Serena","Karen","Samantha"];
  for(var i=0;i<pref.length;i++)for(var j=0;j<vs.length;j++)if(vs[j].name.indexOf(pref[i])>=0)return vs[j];

function ttsRate(r,b){
  TTS.rate=r;
  var all=b.parentNode.querySelectorAll(".chip");
  for(var i=0;i<all.length;i++)all[i].classList.remove("on");
  b.classList.add("on");
  if(TTS.playing){speechSynthesis.cancel();TTS.playing=false;setPlayUI(false);}
}
function setPlayUI(on){
  var b=$("pbtn"),e=$("eq");
  if(b){b.textContent=on?"■":"▶";b.classList.toggle("on",on);}
  if(e)e.classList.toggle("on",on);
}
function ttsToggle(id){
  var L=byId(LISTENING,id);if(!L)return;
  if(!window.speechSynthesis){ttsFallback(id,"This browser cannot read text aloud.");return;}
  if(TTS.playing){speechSynthesis.cancel();TTS.playing=false;setPlayUI(false);return;}
  if(TTS.plays>=2&&!confirm("In the real exam you hear each recording only twice. Play it again anyway?"))return;
  if(!TTS.voice)TTS.voice=pickVoice();
  var u=new SpeechSynthesisUtterance(L.script.replace(/\n+/g,". "));
  u.rate=TTS.rate;u.pitch=1;u.lang="en-GB";
  if(TTS.voice)u.voice=TTS.voice;
  var started=false;
  u.onstart=function(){started=true;};
  u.onend=function(){TTS.playing=false;setPlayUI(false);TTS.plays++;
    var p=$("plays");if(p)p.textContent="Play "+Math.min(TTS.plays,2)+" of 2";};
  u.onerror=function(){TTS.playing=false;setPlayUI(false);ttsFallback(id,"Audio could not start on this device.");};
  TTS.utt=u;TTS.playing=true;setPlayUI(true);
  speechSynthesis.cancel();speechSynthesis.speak(u);
  setTimeout(function(){
    if(!started&&TTS.playing){try{speechSynthesis.cancel();}catch(e){}
      TTS.playing=false;setPlayUI(false);ttsFallback(id,"Audio could not start on this device.");}
  },2500);
}
function ttsFallback(id,why){
  var box=$("tsBox");
  if(box&&box.getAttribute("data-fb")!=="1"){
    box.setAttribute("data-fb","1");
    box.innerHTML='<div class="note b"><b>🔇 '+esc(why)+'</b>Read the transcript below instead and answer the questions as normal — the exam skills are exactly the same. Speech usually works in Chrome, Edge and Safari.</div>';
  }
  showScript(id,true);
}

    '<div class="passage" style="margin:0">'+esc(L.script)+'</div>';
  if(box.getAttribute("data-shown")==="1")return;
  box.setAttribute("data-shown","1");
  box.innerHTML=(append?box.innerHTML:"")+html;

function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x;}
function startSpeak(id){
  if(REC.phase!=="idle"){stopRecording();return;}
  REC.phase="prep";REC.t=15;
  $("phase").textContent="Preparation — plan three ideas with examples";
  $("recBtn").textContent="⏱️";
  $("tmr").textContent=fmt(REC.t);
  clearInterval(REC.timer);
  REC.timer=setInterval(function(){
    REC.t--;$("tmr").textContent=fmt(Math.max(0,REC.t));
    if(REC.t<=0){clearInterval(REC.timer);beginRecord(id);}
  },1000);
}
function beginRecord(id){
  REC.phase="rec";REC.t=90;
  $("phase").textContent="Speak now — keep going for the full 90 seconds";
  $("tmr").textContent=fmt(REC.t);
  $("recBtn").textContent="⏹";$("recBtn").classList.add("on");
  clearInterval(REC.timer);
  REC.timer=setInterval(function(){
    REC.t--;$("tmr").textContent=fmt(Math.max(0,REC.t));
    $("tmr").classList.toggle("warn",REC.t<=10);
    if(REC.t<=0){stopRecording();}
  },1000);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast("Recording is not available in this browser — the timer still works.",3400);return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    REC.stream=st;REC.chunks=[];
    try{REC.mr=new MediaRecorder(st);}catch(e){toast("Recording not supported here — the timer still works.");return;}
    REC.mr.ondataavailable=function(e){if(e.data.size)REC.chunks.push(e.data);};
    REC.mr.onstop=function(){
      try{
        var b=new Blob(REC.chunks,{type:REC.chunks[0]?REC.chunks[0].type:"audio/webm"});
        if(REC.url)URL.revokeObjectURL(REC.url);
        REC.url=URL.createObjectURL(b);
        var pb=$("playBack");
        if(pb)pb.innerHTML='<b style="font-size:13px;color:var(--pri)">YOUR RECORDING</b>'+
          '<audio controls src="'+REC.url+'" style="width:100%;margin-top:8px"></audio>'+
          '<p class="tiny" style="margin-top:6px">Listen for: silences, repeated words, and whether you gave reasons and examples.</p>';
      }catch(e){}
    };
    REC.mr.start();
  }).catch(function(){
    toast("Microphone permission was refused — the timer still works, and you can still practise aloud.",3800);
  });
}
function stopRecording(silent){
  clearInterval(REC.timer);
  if(REC.mr&&REC.mr.state!=="inactive"){try{REC.mr.stop();}catch(e){}}
  if(REC.stream){try{REC.stream.getTracks().forEach(function(t){t.stop();});}catch(e){}REC.stream=null;}
  REC.phase="idle";
  if(!silent){
    var b=$("recBtn"),p=$("phase"),t=$("tmr");
    if(b){b.textContent="🎙️";b.classList.remove("on");}
    if(p)p.textContent="Finished — play it back, then assess yourself below";
    if(t){t.textContent="1:30";t.classList.remove("warn");}
  }
}

function countW(lo,hi){
  var t=$("wtxt");if(!t)return;
  var n=t.value.trim()?t.value.trim().split(/\s+/).length:0;
  var el=$("wc");if(!el)return;
  el.textContent=n+" words";
  el.className="pill "+(n===0?"":(n<lo?"a":(n>hi?"":"o")));
  if(n>hi)el.className="pill a",el.textContent=n+" words — over the limit";
  else if(n>0&&n<lo)el.textContent=n+" words — keep going";
}
function saveWriting(id){
  var t=$("wtxt").value;
  var n=t.trim()?t.trim().split(/\s+/).length:0;
  if(n<20){toast("Write a little more before saving");return;}
  DB.writing[id]={text:t,words:n,at:Date.now()};
  addXP(25);addMinutes(20);save();checkBadges();
  toast("💾 Saved — "+n+" words");confetti(40);
}
function downloadWriting(id){
  var W=byId(WRITING,id),t=$("wtxt").value;
  if(!t.trim()){toast("Nothing to download yet");return;}
  var txt="IGCSE Educational Platform\n"+W.type+" — "+W.t+"\nName: "+DB.name+"   Class: "+DB.grade+"\n"+
    "Word count: "+(t.trim().split(/\s+/).length)+"\n\nTASK\n"+W.brief+"\n\n"+
    W.bullets.map(function(b,i){return (i+1)+". "+b;}).join("\n")+"\n\n--- MY ANSWER ---\n\n"+t+"\n";
  var b=new Blob([txt],{type:"text/plain"});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="IGCSE-"+W.id+"-"+DB.name.replace(/\W/g,"")+".txt";
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
  toast("⬇️ Downloaded — hand this to your teacher");
}

function pickChip(b){
  var all=b.parentNode.querySelectorAll(".chip");
  for(var i=0;i<all.length;i++)all[i].classList.remove("on");
  b.classList.add("on");
}
function chipV(sel,d){
  var e=document.querySelectorAll(sel+" .chip");
  for(var i=0;i<e.length;i++)if(e[i].classList.contains("on"))return e[i].dataset.v;
  return d;
}
function startDrill(){
  var t=$("dTop").value,lv=chipV("#dLv","both"),n=parseInt(chipV("#dN","10"),10);
  var pool=BANK.filter(function(q){
    if(q.type!=="mcq"&&q.type!=="fill")return false;
    if(t!=="all"&&q.t!==t)return false;
    if(lv!=="both"&&q.tier!==lv)return false;
    return true;
  });
  if(pool.length<3){toast("Not enough questions for that combination — try Mixed.");return;}
  pool=pool.slice().sort(function(){return Math.random()-.5}).slice(0,n);
  var qs=pool.map(function(q){
    if(q.type==="fill")return {type:"short",q:(q.p?q.p+"<br><br>":"")+q.q,ans:q.ans,e:q.e};
    return {type:"mcq",q:(q.p?'<div class="passage" style="margin-bottom:10px">'+esc(q.p)+'</div>':"")+q.q,o:q.o,a:q.a,e:q.e};
  });
  $("v-drill").innerHTML=backBtn()+'<h2 style="font-size:21px;margin-bottom:12px">⚡ Quick Drill</h2><div class="card" id="dqz"></div>';
  renderQuiz(qs,$("dqz"),function(p,c,tot){
    DB.drill.c+=c;DB.drill.t+=tot;addXP(10+c);addMinutes(Math.round(tot*0.6));save();checkBadges();
    $("dqz").innerHTML+='<div class="row" style="margin-top:12px">'+
      '<button class="btn pri" onclick="go(\'drill\')">Another drill</button>'+
      '<button class="btn gh" onclick="go(\'practice\')">Skill Labs</button></div>';
  },"dq");
}

    (rows?'<div style="text-align:left">'+rows+'</div>':'')+

    '<button class="btn gh" onclick="EX.e=null;go(\'me\')">My progress</button></div></div>';
  if(score>=70)confetti(120);

    if(!ok.length)throw 0;
    DB.custom=(DB.custom||[]).concat(ok);
    for(var i=0;i<ok.length;i++)BANK.push(ok[i]);
    save();toast("✅ "+ok.length+" question(s) added");go("teacher");
  }catch(e){toast("❌ That is not valid question JSON");}
}
function exportCSV(){
  var s=skillStats(),rows=[["Student","Class","Metric","Completed","Total","Percent"]];
  for(var k in s)rows.push([q(DB.name),q(DB.cls||DB.grade),q(s[k].n),Math.min(s[k].d,s[k].t),s[k].t,pct(Math.min(s[k].d,s[k].t),s[k].t)]);
  rows.push([q(DB.name),q(DB.cls||DB.grade),"Overall","","",overallPct()]);
  rows.push([q(DB.name),q(DB.cls||DB.grade),"XP","","",DB.xp]);
  rows.push([q(DB.name),q(DB.cls||DB.grade),"Study streak (days)","","",DB.streak.days]);
  for(var id in DB.exams){var e=byId(EXAMS,id);if(e)rows.push([q(DB.name),q(DB.cls||DB.grade),q(e.t),"","",DB.exams[id].score]);}
  dl("IGCSE-Progress-"+DB.name.replace(/\W/g,"")+".csv",rows.map(function(r){return r.join(",")}).join("\n"),"text/csv");
  toast("📊 CSV downloaded");
}
function q(s){return '"'+String(s==null?"":s).replace(/"/g,"'")+'"';}
function dl(name,content,type){
  var b=new Blob([content],{type:type||"text/plain"});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1200);
}

   ' &nbsp;·&nbsp; <b>Date:</b> '+d.toLocaleDateString()+'</p>'+
   '<p><b>Overall completion:</b> '+overallPct()+'% &nbsp;·&nbsp; <b>Study streak:</b> '+DB.streak.days+
   ' days (best '+DB.streak.best+') &nbsp;·&nbsp; <b>Badges:</b> '+DB.badges.length+' / '+BADGES.length+'</p>'+

function buildAssignment(){
  var op='';
  op+='<optgroup label="Course lessons">';
  for(var i=0;i<COURSE.length;i++)for(var j=0;j<COURSE[i].lessons.length;j++)
    op+='<option value="lesson|'+COURSE[i].lessons[j].id+'">'+esc(COURSE[i].t)+' — '+esc(COURSE[i].lessons[j].t)+'</option>';
  op+='</optgroup><optgroup label="Reading">';
  for(var i=0;i<READING.length;i++)op+='<option value="reading|'+READING[i].id+'">'+esc(READING[i].t)+'</option>';
  op+='</optgroup><optgroup label="Listening">';
  for(var i=0;i<LISTENING.length;i++)op+='<option value="listening|'+LISTENING[i].id+'">'+esc(LISTENING[i].t)+'</option>';
  op+='</optgroup><optgroup label="Speaking">';
  for(var i=0;i<SPEAKING.length;i++)op+='<option value="speaking|'+SPEAKING[i].id+'">'+esc(SPEAKING[i].t)+'</option>';
  op+='</optgroup><optgroup label="Writing">';
  for(var i=0;i<WRITING.length;i++)op+='<option value="writing|'+WRITING[i].id+'">'+esc(WRITING[i].t)+'</option>';
  op+='</optgroup>';
  sheet('<h3 style="margin-bottom:6px">📋 Build an assignment</h3>'+
   '<p class="sub" style="margin-bottom:12px">Hold Ctrl (or Cmd) to select several activities.</p>'+
   '<select class="inp" id="asSel" multiple size="10" style="height:auto">'+op+'</select>'+
   '<label class="lb" style="margin-top:12px">Due date</label><input class="inp" id="asDue" placeholder="e.g. Sunday 12 October">'+
   '<button class="btn pri" style="margin-top:14px" onclick="makeAssignment()">Generate sheet</button>'+
   '<div id="asOut"></div>');
}
function makeAssignment(){
  var sel=$("asSel"),picked=[];
  for(var i=0;i<sel.options.length;i++)if(sel.options[i].selected)picked.push(sel.options[i]);
  if(!picked.length){toast("Select at least one activity");return;}
  var due=$("asDue").value||"(no date set)";
  var lines="IGCSE EDUCATIONAL PLATFORM — HOMEWORK\n"+
    "Class: "+(DB.cls||DB.grade)+"\nDue: "+due+"\n"+
    "Open: https://abuahmedjibber-maker.github.io/igcse-platform/\n\nComplete the following:\n";
  for(var i=0;i<picked.length;i++)lines+="  "+(i+1)+". "+picked[i].text+"\n";
  lines+="\nWhen you have finished, go to My Progress → Export CSV and send the file to your teacher.\n\n"+
    "Mr. Jibber Ahmed Mohammed";
  $("asOut").innerHTML='<div class="passage" style="margin-top:14px">'+esc(lines)+'</div>'+
    '<div class="row" style="margin-top:10px"><button class="btn sm pri" onclick="copyTxt(`'+lines.replace(/`/g,"")+'`)">📋 Copy</button>'+
    '<button class="btn sm" onclick="dl(\'IGCSE-Homework.txt\',`'+lines.replace(/`/g,"")+'`)">⬇️ Download</button></div>';
}
function copyTxt(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("📋 Copied");},function(){prompt("Copy:",t);});
  else prompt("Copy:",t);
}
function printWorksheet(){
  var pool=BANK.filter(function(q){return q.type==="mcq"||q.type==="fill";});
  pool=pool.slice().sort(function(){return Math.random()-.5}).slice(0,20);
  var h='<html><head><meta charset="utf-8"><title>IGCSE Worksheet</title><style>'+
   'body{font-family:Georgia,serif;max-width:760px;margin:26px auto;padding:0 18px;color:#111;line-height:1.6}'+
   'h1{font-size:19px;margin:0 0 2px}h2{font-size:12px;font-weight:400;color:#555;margin:0 0 18px}'+
   '.q{margin:0 0 14px;page-break-inside:avoid}.q b{display:block;margin-bottom:3px}'+
   '.p{background:#f3f3f3;border-left:3px solid #888;padding:7px 10px;margin:5px 0;font-size:13px;white-space:pre-wrap}'+
   '.o{margin-left:16px;font-size:14px}.key{margin-top:26px;border-top:1px solid #bbb;padding-top:12px;font-size:12px}'+
   '@media print{.no{display:none}}</style></head><body>'+
   '<h1>IGCSE Educational Platform — Practice Worksheet</h1>'+
   '<h2>English as a Second Language 0510 / 0511 &nbsp;·&nbsp; Name: ______________ Class: ________ Date: ________</h2>';
  var key=[];
  for(var i=0;i<pool.length;i++){var q=pool[i];
    h+='<div class="q"><b>'+(i+1)+'. '+esc(q.q)+'</b>';
    if(q.p)h+='<div class="p">'+esc(q.p)+'</div>';
    if(q.type==="mcq"){for(var j=0;j<q.o.length;j++)h+='<div class="o">'+"ABCD"[j]+') '+esc(q.o[j])+'</div>';key.push((i+1)+". "+"ABCD"[q.a]+" — "+q.o[q.a]);}
    else{h+='<div class="o">Answer: ____________________________</div>';key.push((i+1)+". "+q.ans[0]);}
    h+='</div>';}
  h+='<div class="key"><b>ANSWER KEY (teacher copy)</b><br>'+key.map(esc).join("<br>")+'</div>'+
   '<p style="margin-top:18px;font-size:11px;color:#666">Mr. Jibber Ahmed Mohammed · B.Ed, M.A, TKT &amp; TESOL certified</p>'+
   '<button class="no" onclick="window.print()" style="margin-top:14px;padding:9px 16px">🖨️ Print</button></body></html>';
  var w=window.open("","_blank");
  if(w){w.document.write(h);w.document.close();}else{dl("IGCSE-Worksheet.html",h,"text/html");toast("Worksheet downloaded");}
}

/* ================= INIT ================= */
var _boot=false;
function init(){
  if(_boot)return;_boot=true;
  load();applyTheme();
  if(DB.custom&&DB.custom.length)for(var i=0;i<DB.custom.length;i++)BANK.push(DB.custom[i]);
  if(window.speechSynthesis){
    TTS.voice=pickVoice();
    speechSynthesis.onvoiceschanged=function(){TTS.voice=pickVoice();};
  }
  go(DB.name?"home":"welcome",null,true);
  window.addEventListener("resize",function(){if(cvE){cvE.width=innerWidth;cvE.height=innerHeight;}});
  window.addEventListener("beforeunload",function(){save();});
  document.addEventListener("visibilitychange",function(){if(document.hidden)stopAllMedia();});
}
document.addEventListener("DOMContentLoaded",init);
if(document.readyState==="complete"||document.readyState==="interactive")setTimeout(init,50);
