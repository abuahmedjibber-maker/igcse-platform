{id:"u1l3",t:"Reading the question properly",m:9,
obj:["Identify instruction words and obey them exactly","Avoid the three most common instruction errors"],
html:`<p>More marks are lost to careless reading of the <i>question</i> than to weak English. Train this first.</p>
<h4>Instruction words that change everything</h4>
<ul>
<li><b>Give TWO reasons</b> — exactly two. A third wrong one can cancel a correct answer.</li>
<li><b>In your own words</b> — rephrase. Copying the text scores nothing here.</li>
<li><b>Using the text</b> — your evidence must come from the passage, not your general knowledge.</li>
<li><b>Briefly</b> — a phrase, not a paragraph.</li>
<li><b>NOT</b> / <b>EXCEPT</b> — you are looking for the odd one out. Tick off the ones you <i>can</i> find.</li>
</ul>
<h4>The three-second habit</h4>
<p>Before you write anything, underline: (1) the instruction verb, (2) any number, (3) any limiting word such as <i>only</i>, <i>except</i>, <i>main</i>, <i>first</i>.</p>
<div class="note b"><b>Real example</b>Question: "Give <b>one</b> reason, in your <b>own words</b>, why the scheme failed."<br>A student writes three reasons copied from the text. Marks awarded: <b>zero</b> — wrong number, wrong wording.</div>
<h4>Word limits are absolute</h4>
<p>If a listening gap-fill says "no more than three words", four words scores nothing even when the idea is right. The limit is part of the test.</p>`,
check:[
{q:"The question says 'Give TWO reasons'. You give four. What is the likely result?",o:["Extra marks","Usually only the first two are marked, and a wrong one can cost you","No effect","Automatic zero"],a:1,e:"Answer exactly what is asked. Extra material can cancel a correct answer."},
{q:"'In your own words' means…",o:["invent new information","rephrase the idea using different wording","translate it","copy the sentence exactly"],a:1,e:"Paraphrasing proves you understood. Copying only proves you found the line."},
{q:"A gap-fill says 'no more than THREE words'. You write five. The answer is…",o:["correct","marked wrong","given half marks","marked by the examiner's choice of three"],a:1,e:"Word limits are absolute — obey them exactly."}
]}
]},

{id:"u2",t:"Reading Skills",sub:"Skim, scan, infer and summarise",ic:"📖",lessons:[

{id:"u2l1",t:"Skimming and scanning",m:10,
obj:["Use skimming to find the gist in under a minute","Use scanning to locate a specific detail fast"],
html:`<p>You do not have time to read every reading text word by word. Two different techniques do two different jobs.</p>
<h4>Skimming — for the general idea</h4>
<p>Move your eyes quickly over the text. Read the title, the first sentence of each paragraph, and the last sentence overall. In about forty seconds you should be able to say what the text is about and roughly how it is organised.</p>
<h4>Scanning — for one specific piece of information</h4>
<p>Now you are hunting. You already know what you want — a date, a name, a number, a place. Do not read: <i>search</i>. Your eyes look only for the shape of the thing you need.</p>
<div class="note"><b>The exam order that works</b>1. Skim the text (40 seconds). 2. Read the questions and underline the key words. 3. Scan back into the text for each answer. Most students do this backwards and run out of time.</div>
<h4>Key words are the bridge</h4>
<p>The question rarely uses the same words as the text. If the question asks about "the cost of entry" the text may say "admission is priced at". Train yourself to look for <i>synonyms</i>, not identical words.</p>
<h4>Paragraph topic sentences</h4>
<p>In non-fiction, the main idea of a paragraph is usually in its first or last sentence. When a question asks "which paragraph mentions…", read only those sentences first.</p>`,
check:[
{q:"You need to find the opening time of a museum. Which technique?",o:["Skimming","Scanning","Reading every word","Inferring"],a:1,e:"Scanning: you know exactly what you are looking for, so hunt for it rather than read."},
{q:"What should you do FIRST with a long reading text?",o:["Read every word carefully","Skim for the general idea, then read the questions","Answer from memory","Copy the first paragraph"],a:1,e:"Skim, then read the questions, then scan back. This is the fastest reliable order."},
{q:"The question says 'entry cost'; the text says 'admission is priced at'. This shows that…",o:["the question is wrong","you must look for synonyms, not identical words","the answer is not in the text","you should copy the question"],a:1,e:"Exam questions deliberately paraphrase the text. Hunting for identical words will make you miss answers."}
]},

{id:"u2l2",t:"Multiple matching",m:10,
obj:["Break a matching question into conditions","Eliminate options systematically"],
html:`<p>Multiple matching gives you several short texts (courses, camps, hotels, jobs) and several people with needs. Your job is to match them.</p>
<h4>Turn each person into a checklist</h4>
<p>Almost every person description contains <b>two or three conditions</b>. Underline them.</p>
<div class="note"><b>Worked example</b>"Layla is 15, has no experience, and is only free at weekends."<br>Conditions: ① age 15 ② beginner ③ weekends only.<br>Now any option failing even one condition is eliminated — even if it looks perfect otherwise.</div>
<h4>The trap</h4>
<p>Every wrong option satisfies <i>most</i> of the conditions. That is the whole design of the question. A camp that is perfect for beginners aged 14–18 but runs on weekdays is <b>wrong</b> for Layla.</p>
<h4>Method</h4>
<ol>
<li>Read all the short texts once, quickly.</li>
<li>Take person 1, underline their conditions.</li>
<li>Go through the options ticking and crossing.</li>
<li>Cross out an option once it is used, if the task says each is used once.</li>
</ol>`,
check:[
{q:"How many conditions does a typical matching description contain?",o:["Always one","Usually two or three","Always five","None"],a:1,e:"Two or three conditions is typical — and wrong options usually satisfy all but one of them."},
{q:"An option matches the person's age and interest but not the days they are free. It is…",o:["correct","wrong — every condition must be satisfied","partly correct","the best available"],a:1,e:"All conditions must be met. Failing one eliminates the option completely."}
]},

{id:"u2l3",t:"Inference — reading between the lines",m:12,
obj:["Work out what a writer suggests but does not state","Identify a writer's attitude from small clues"],
html:`<p>Some answers are not written in the text. They are <i>implied</i>. This is where stronger candidates separate themselves.</p>
<h4>What inference looks like</h4>
<div class="passage">Nadia had trained for eleven months. Standing at the start line, she found that her hands would not stop shaking, yet she smiled at the crowd as though nothing at all was wrong.</div>
<p>The text never says Nadia is nervous. But <b>shaking hands</b> plus <b>"as though nothing was wrong"</b> tells you she is nervous <i>and hiding it</i>. That is the answer.</p>
<h4>Where the clues hide</h4>
<ul>
<li><b>Actions</b> — sighing, checking a clock repeatedly, pausing before speaking.</li>
<li><b>Contrast words</b> — <i>yet, although, however, though</i>. The idea after them is usually the important one.</li>
<li><b>Word choice</b> — "a great deal of public money" next to "used eleven days a year" is criticism without a single critical word.</li>
<li><b>What is missing</b> — a writer who praises everything except one thing is telling you about that one thing.</li>
</ul>
<div class="note a"><b>Rule</b>Every inference must still be <b>supported by the text</b>. If you cannot point to the words that led you there, it is a guess, not an inference.</div>`,
check:[
{q:"'Another meeting?' sighed Mr Okoro, glancing at the clock for the third time in five minutes. He is…",o:["enthusiastic","impatient","confused","worried about being late"],a:1,e:"The sigh plus repeated clock-watching implies impatience. Writers show attitude through actions."},
{q:"Which word most often signals that the important idea is coming next?",o:["and","yet","also","then"],a:1,e:"Contrast words such as yet, although, however and though usually introduce the key idea."},
{q:"A valid inference must be…",o:["your personal opinion","supported by specific words in the text","longer than the question","copied exactly"],a:1,e:"If you cannot point to the evidence, it is a guess rather than an inference."}
]},

{id:"u2l4",t:"Note-making",m:10,
obj:["Sort information into the right category","Write notes that are short but complete"],
html:`<p>The note-making exercise gives you headings and asks you to fill in points under each one. It looks easy and students lose marks on it constantly.</p>
<h4>The two skills being tested</h4>
<ol>
<li><b>Selection</b> — is this point relevant to <i>this</i> heading?</li>
<li><b>Compression</b> — can you keep the meaning in far fewer words?</li>
</ol>
<h4>Watch the discourse markers</h4>
<p>Words like <b>however, on the other hand, yet</b> usually mark the moment the writer switches from advantages to disadvantages. That is often exactly where your second column begins.</p>
<div class="note"><b>Good and bad notes</b>
Text: "The main reason people gave for not recycling was that they did not have enough space at home."<br>
❌ Too long: <i>The main reason that people give for not recycling is that they do not have enough space at home.</i><br>
❌ Too short: <i>No space.</i> (No space for what? For whom?)<br>
✅ Just right: <i>Lack of space at home</i></div>
<h4>Do not write full sentences</h4>
<p>They waste time, add errors and gain nothing. A phrase carrying the full idea is what earns the mark.</p>`,
check:[
{q:"Which is the best note form?",o:["The main reason people gave was a lack of space in their homes.","Lack of space at home","No space.","Space is a problem for many people who do not recycle at home."],a:1,e:"Notes should be brief phrases that still carry the complete idea."},
{q:"'However' in a text usually signals…",o:["an example","a switch to the opposite category","a conclusion","a repetition"],a:1,e:"It often marks the point where advantages become disadvantages — useful for sorting your notes."}
]},

{id:"u2l5",t:"Summary writing",m:14,
obj:["Select only the points the question asks for","Rewrite them in your own words within the word limit"],
html:`<p>The summary is the highest-value reading exercise and the one most worth training. It tests selection, paraphrase and control of length all at once.</p>
<h4>Step 1 — read the question twice</h4>
<p>If it says "summarise the <b>disadvantages</b> of tourism", the advantages in the text are worth nothing to you. Underline the focus word before you read the text.</p>
<h4>Step 2 — underline, then count</h4>
<p>Mark every relevant point in the text. Watch for the same idea expressed twice — that is one point, not two.</p>
<h4>Step 3 — rewrite, do not copy</h4>
<ul>
<li>"looks impressive on a university application" → <i>strengthens a university application</i></li>
<li>"costs a great deal of money to install" → <i>the installation cost is high</i></li>
</ul>
<h4>Step 4 — join the points into continuous prose</h4>
<p>Not bullet points. Use a short framing sentence and connectives:</p>
<div class="note o"><b>A reliable structure</b><i>The text outlines several drawbacks of tourism. Firstly, … In addition, … A further problem is that … Overall, …</i></div>
<h4>Step 5 — obey the word limit</h4>
<p>Around 120 words means around 120 words. Over-long summaries almost always contain copied sentences, and copied language cannot score for Language.</p>`,
check:[
{q:"The question asks only for disadvantages. The text also gives advantages. You should…",o:["include both to be safe","include only disadvantages","write two paragraphs","copy the whole text"],a:1,e:"Answering outside the question earns nothing and uses up your word limit."},
{q:"You spot the same idea written twice in the text. In your summary it counts as…",o:["two points","one point","three points","it should be ignored completely"],a:1,e:"Repetition in the text is one point. Spotting it stops you wasting words."},
{q:"Which is the best summary opening?",o:["- fewer jobs\\n- higher prices","The text is about tourism.","The text outlines several drawbacks of tourism. Firstly, …","Tourism, jobs, prices, crowding."],a:2,e:"A short framing sentence followed by linked points is continuous writing, which is what the task requires."}
]}
]},

{id:"u3",t:"Writing Skills",sub:"Email, letter, article, report and review",ic:"✍️",lessons:[

{id:"u3l1",t:"Register — formal or informal?",m:12,
obj:["Choose the right level of formality for the reader","Convert informal phrases into formal ones"],
html:`<p>Register is the single fastest way to raise a writing mark. It costs no extra vocabulary — only awareness of <i>who is reading</i>.</p>
<h4>Ask one question: who will read this?</h4>
<ul>
<li><b>A friend or cousin</b> → informal. Contractions, exclamation marks, questions to the reader, everyday vocabulary.</li>
<li><b>A head teacher, manager, newspaper, official</b> → formal. No contractions, no slang, indirect and polite structures.</li>
</ul>
<h4>Openings and endings must agree</h4>
<table style="width:100%;font-size:14px;border-collapse:collapse">
<tr><td style="padding:6px 0"><b>Dear Sir or Madam</b> (no name)</td><td>→ <b>Yours faithfully</b></td></tr>
<tr><td style="padding:6px 0"><b>Dear Mrs Ali</b> (named)</td><td>→ <b>Yours sincerely</b></td></tr>
<tr><td style="padding:6px 0"><b>Hi Samir</b></td><td>→ <b>See you soon / Take care</b></td></tr>
</table>
<h4>Ten conversions worth memorising</h4>
<ul>
<li>Sorry about that → <i>I apologise for the inconvenience</i></li>
<li>Get back to me → <i>I look forward to hearing from you</i></li>
<li>I need to know → <i>I would like to enquire</i></li>
<li>Thanks a lot → <i>I am extremely grateful</i></li>
<li>A lot of problems → <i>numerous difficulties</i></li>
<li>Get in touch with → <i>contact</i></li>
<li>Find out → <i>establish / determine</i></li>
<li>Put up with → <i>tolerate</i></li>
<li>Ask for → <i>request</i></li>
<li>I want → <i>I would be grateful if you could</i></li>
</ul>
<div class="note b"><b>Never mix registers</b>"Dear Sir or Madam, Thanks a million for sorting this out!" loses marks precisely because the two halves belong to different worlds.</div>`,
check:[
{q:"You begin 'Dear Sir or Madam'. You must end with…",o:["Yours sincerely","Yours faithfully","Best wishes","See you soon"],a:1,e:"No name → 'Yours faithfully'. A named recipient → 'Yours sincerely'."},
{q:"Which is the most appropriate formal request?",o:["Send me the details now.","I want the details.","I would be grateful if you could send me further details.","Can u send details?"],a:2,e:"Indirect, tentative language is the marker of formal politeness."},
{q:"Which phrase belongs in an INFORMAL email only?",o:["I am writing to enquire","Can't wait to see you!","I would appreciate your consideration","I look forward to your reply"],a:1,e:"Contractions and exclamation marks suit informal writing but weaken a formal letter."}
]},

{id:"u3l2",t:"Emails and letters",m:12,
obj:["Cover every content point in the task","Structure a letter in clear paragraphs"],
html:`<p>The task will give you two or three things to do. Each one is a <b>content point</b>, and each carries marks.</p>
<div class="note"><b>Typical task</b>"Write an email to your friend. <b>Describe</b> the event, <b>explain</b> why you were nervous, and <b>say</b> what you will do next time."<br>That is three content points. Tick each one off as you write it. The third is the one students forget.</div>
<h4>The three-block structure</h4>
<ol>
<li><b>Opening</b> — greeting and purpose. One or two sentences. "I am writing to…" or "How are you? I had to tell you about…"</li>
<li><b>Body</b> — one paragraph per content point. This is where the detail and development live.</li>
<li><b>Close</b> — a polite or friendly ending that fits the register.</li>
</ol>
<h4>Development is what separates grades</h4>
<p>Do not just state a point — extend it with a reason, an example or a consequence.</p>
<ul>
<li>Weak: <i>The trip was good.</i></li>
<li>Strong: <i>The trip was far better than I expected, mainly because our guide had grown up in the village and told us stories no guidebook contains.</i></li>
</ul>
<h4>Length</h4>
<p>Stay inside the range you are given. If it says 150–200 words, aim for about 180. Writing 260 words does not impress anyone — it simply creates more chances to make mistakes.</p>`,
check:[
{q:"The task says: describe the event, explain why you were nervous, say what you will do next time. How many content points?",o:["One","Two","Three","As many as you like"],a:2,e:"Three. Missing one costs Content marks even if the English is excellent."},
{q:"Which sentence shows the best DEVELOPMENT?",o:["The food was nice.","The food was very nice and good.","The food was unforgettable — especially the grilled fish, which the owner cooked over an open fire.","The food. It was nice."],a:2,e:"Detail, examples and reasons demonstrate development, which is directly rewarded."},
{q:"Your email must be 150–200 words. You write 270. The likely effect is…",o:["a higher mark","loss of marks for relevance and control","no effect","automatic zero"],a:1,e:"Over-writing adds irrelevance and errors."}
]},

{id:"u3l3",t:"Articles",m:12,
obj:["Open an article in a way that hooks the reader","Use rhetorical devices appropriately"],
html:`<p>An article is written for <i>readers</i> — a school magazine, a website, a newspaper. Your job is to interest them, not simply to inform them.</p>
<h4>The opening decides everything</h4>
<ul>
<li>❌ <i>In this article I will discuss school trips.</i> (announces, does not engage)</li>
<li>✅ <i>Picture this: thirty teenagers, one mountain and absolutely no phone signal.</i></li>
<li>✅ <i>Have you ever wondered what happens to the rubbish you throw away?</i></li>
</ul>
<h4>Devices that belong in an article</h4>
<ul>
<li><b>Direct address</b> — speak to "you".</li>
<li><b>Rhetorical questions</b> — one or two, not ten.</li>
<li><b>A short anecdote</b> — one specific person or moment beats general claims.</li>
<li><b>A title</b> — short and punchy. <i>Sport: Is Two Hours a Week Really Enough?</i></li>
</ul>
<h4>Balance shows maturity</h4>
<p>Even when you have a strong opinion, acknowledge the other side. Concession language earns high Content marks:</p>
<div class="note o"><i>Although uniform undeniably limits self-expression, it does remove the daily competition over clothing that makes so many students miserable.</i></div>
<h4>Ending</h4>
<p>Leave the reader with something: a call to action or a final question. <i>So the next time you reach for a plastic bottle, ask yourself: is it really worth it?</i></p>`,
check:[
{q:"Which is the strongest article opening?",o:["In this article I will discuss recycling.","Recycling is a topic.","Every hour, our city throws away enough plastic to fill a classroom.","This is my article about recycling."],a:2,e:"A vivid, specific image engages the reader immediately."},
{q:"Which sentence shows a balanced, mature argument?",o:["School uniform is completely pointless.","Everyone hates uniform.","Although uniform limits self-expression, it does reduce peer pressure over clothing.","Uniform is good."],a:2,e:"Concession followed by your own point is the mark of a strong argumentative writer."}
]},

{id:"u3l4",t:"Reports",m:11,
obj:["Organise a report into clear sections","End with a recommendation"],
html:`<p>A report is written for someone who must <b>make a decision</b> — a head teacher, a principal, a committee. It informs, then advises.</p>
<h4>Tone</h4>
<p>Neutral and factual. No jokes, no personal stories, no complaints. Where an article persuades with feeling, a report persuades with evidence.</p>
<h4>Structure</h4>
<ol>
<li><b>Purpose</b> — why this report exists. <i>This report examines the use of the school library and suggests improvements.</i></li>
<li><b>Findings</b> — what you discovered, grouped logically. Headings are welcome.</li>
<li><b>Recommendations</b> — what should now happen.</li>
</ol>
<h4>Useful report language</h4>
<ul>
<li><i>The survey revealed that…</i></li>
<li><i>A significant number of students reported…</i></li>
<li><i>It appears that the main difficulty is…</i></li>
<li><i>I would therefore recommend that…</i></li>
</ul>
<div class="note a"><b>The commonest failure</b>Students write a lovely description and then stop. A report without a recommendation has not done its job.</div>`,
check:[
{q:"A report should end with…",o:["a joke","a recommendation","a personal story","a list of complaints"],a:1,e:"'I would recommend…' is exactly what the examiner is looking for."},
{q:"Which sentence best suits a report?",o:["The canteen is honestly the worst!","The survey revealed that most students would prefer a longer lunch break.","I hated the food.","So please do something about it!"],a:1,e:"Reports use neutral, evidence-based language."}
]},

{id:"u3l5",t:"Reviews",m:10,
obj:["Balance description with evaluation","Finish with a clear recommendation"],
html:`<p>A review does three things: it <b>describes</b>, it <b>judges</b>, and it <b>recommends</b>. Many students do only the first and lose most of the marks.</p>
<h4>What to cover</h4>
<ul>
<li>For a film: story (without spoiling it), acting, direction, who would enjoy it.</li>
<li>For a restaurant: food, service, atmosphere, value, who it suits.</li>
<li>For an app or product: what it does, what works, what does not, who should buy it.</li>
</ul>
<h4>Evaluate, do not just describe</h4>
<ul>
<li>❌ <i>The acting was by a famous actor.</i></li>
<li>✅ <i>The lead performance was extraordinary — she conveyed more with a silence than most actors manage with a speech.</i></li>
</ul>
<h4>Balance is expected</h4>
<div class="note"><i>Although the acting was excellent, the plot was far too predictable; I guessed the ending within twenty minutes.</i></div>
<h4>Always recommend</h4>
<p><i>If you enjoy slow, thoughtful drama, this is well worth your evening. If you want action, look elsewhere.</i></p>`,
check:[
{q:"A review must include…",o:["only the plot","description, evaluation and a recommendation","only your feelings","only the price"],a:1,e:"Description alone is not a review — the judgement and recommendation carry the marks."},
{q:"Which sentence evaluates rather than describes?",o:["The film is two hours long.","It was released last year.","The pacing dragged badly in the middle hour.","It stars two actors."],a:2,e:"Evaluation gives a judgement with a reason."}
]},

{id:"u3l6",t:"Planning and proof-reading",m:10,
obj:["Plan a piece of writing in five minutes","Proof-read for your own repeated errors"],
html:`<p>Two habits, five minutes each, worth more marks than almost anything else you can do.</p>
<h4>The five-minute plan</h4>
<ol>
<li>Underline the content points in the task.</li>
<li>Decide the register (formal / informal) and write it at the top of your plan.</li>
<li>Write one line per paragraph — just the idea, not sentences.</li>
<li>Note three or four pieces of ambitious vocabulary you want to use.</li>
</ol>
<div class="note o"><b>Why it works</b>A plan stops you drifting off task in paragraph three, which is where most Content marks are lost.</div>
<h4>The five-minute proof-read</h4>
<p>Do not read for meaning — you will not see your own mistakes. Instead, hunt for <b>your</b> specific weaknesses. Most students have three or four repeating errors:</p>
<ul>
<li>Third person -s (<i>he go</i> → <i>he goes</i>)</li>
<li>Plurals (<i>many student</i> → <i>many students</i>)</li>
<li>Articles (<i>I am student</i> → <i>I am a student</i>)</li>
<li>Past tense endings (<i>yesterday I walk</i> → <i>walked</i>)</li>
<li>Capital letters and full stops</li>
</ul>
<div class="note a"><b>Build your personal error list</b>Every time a piece of work is returned, add your mistakes to a list at the back of your notebook. Before the exam, that list is the most valuable page you own.</div>`,
check:[
{q:"What is the best use of your first five minutes?",o:["Start writing immediately","Plan the paragraphs and note key vocabulary","Count the words","Write the ending first"],a:1,e:"Planning protects your Content and Organisation marks."},
{q:"When proof-reading you should…",o:["read for general meaning","hunt for your own known repeated errors","add another paragraph","rewrite the introduction"],a:1,e:"Targeted checking of known weaknesses recovers far more marks than general re-reading."}
]}
]},

{id:"u4",t:"Listening Skills",sub:"Gist, detail, attitude and distractors",ic:"🎧",lessons:[

{id:"u4l1",t:"Before the recording starts",m:8,
obj:["Use the pause to predict the answers","Underline key words in the questions"],
html:`<p>The seconds before each extract are the most valuable in the whole paper — and most students waste them.</p>
<h4>Predict the type of answer</h4>
<p>Look at the gap. Is it a number? A time? A place? A person's name? Knowing what kind of thing you are waiting for makes it far easier to catch.</p>
<div class="note"><b>Example</b>"Weekday closing time: ______" → you are listening for a <b>time</b>. Everything else in the recording can wash over you.</div>
<h4>Underline key words</h4>
<p>In the question, not the options. The key words tell you when the answer is approaching.</p>
<h4>You hear everything twice</h4>
<ul>
<li><b>First listening</b> — get the general idea and catch the easy answers.</li>
<li><b>Second listening</b> — confirm what you have and fill the gaps you left.</li>
</ul>
<div class="note b"><b>Do not freeze</b>If you miss one answer, leave it blank and move on immediately. Students lose three answers by refusing to abandon one.</div>`,
check:[
{q:"During the pause before an extract you should…",o:["close your eyes","read the questions and predict the answer type","write your name","do nothing"],a:1,e:"Predicting whether you need a number, a name or a place makes the answer much easier to catch."},
{q:"You miss an answer during the first listening. You should…",o:["stop and panic","leave a gap, move on and catch it second time","guess and stop listening","go back and re-read everything"],a:1,e:"Never let one missed answer cost you the next three."}
]},

{id:"u4l2",t:"Distractors — the exam's favourite trick",m:11,
obj:["Recognise information that is mentioned then rejected","Wait for the speaker's final decision"],
html:`<p>A distractor is a piece of information that sounds like the answer but is not. Paper 2 is full of them and they are entirely predictable once you know the patterns.</p>
<h4>Pattern 1 — mentioned then rejected</h4>
<div class="passage">"I'll take the blue one… actually, no, make that the green. The blue is far too dark."</div>
<p>Blue is mentioned <i>first</i> and loudly. The answer is <b>green</b>. Listen for <i>actually, no, wait, on second thoughts, make that</i>.</p>
<h4>Pattern 2 — the correction</h4>
<div class="passage">"The 14:20 service will now depart from platform 6, not platform 3."</div>
<p>The last piece of information wins.</p>
<h4>Pattern 3 — two figures, two people</h4>
<div class="passage">"Tickets cost fifteen dollars, but students pay only ten."</div>
<p>Both numbers are real. The question decides which one you need. Always check <b>who</b> each figure belongs to.</p>
<h4>Pattern 4 — the self-correction of a number</h4>
<div class="passage">"Attendance was around three hundred — well, nearer two hundred and eighty, to be precise."</div>
<p>"To be precise" flags the real answer.</p>`,
check:[
{q:"'I'll take the blue one… actually, no, make that the green.' The answer is…",o:["blue","green","both","neither"],a:1,e:"'Actually' signals a change of mind. Wait for the final decision."},
{q:"'Tickets cost fifteen dollars, but students pay only ten.' A student pays…",o:["$15","$10","$25","$5"],a:1,e:"When two figures appear, check who each one applies to."},
{q:"Which phrase most often flags the CORRECT figure?",o:["I think","to be precise","possibly","around"],a:1,e:"Self-corrections such as 'to be precise' mark the accurate number."}
]},

{id:"u4l3",t:"Listening for attitude and opinion",m:11,
obj:["Judge a speaker's overall attitude from mixed evidence","Recognise polite disagreement"],
html:`<p>Some questions ask how a speaker <i>feels</i>. The answer is rarely one word — you must weigh the whole comment.</p>
<h4>Weigh, do not snatch</h4>
<div class="passage">"The workshop was, on the whole, well organised — although I have to say the room was uncomfortably hot and the microphone failed twice."</div>
<p>Positive overall, with reservations. Not "entirely positive", not "completely negative". Options in the exam will offer you both extremes.</p>
<h4>Polite disagreement sounds like agreement</h4>
<div class="passage">Interviewer: "So the project failed?"<br>Scientist: "I wouldn't put it quite like that. We simply learned what does not work."</div>
<p>She is disagreeing — politely. Phrases to recognise: <i>I wouldn't say that exactly / I'm not entirely convinced / with respect / that's one way of looking at it</i>.</p>
<h4>Conditions arrive at the end</h4>
<div class="passage">"The course is excellent value… assuming, of course, that you can attend every session."</div>
<p>Listen to the full stop, not just the first clause.</p>`,
check:[
{q:"'On the whole it was well organised, although the room was too hot.' The attitude is…",o:["entirely positive","mostly positive with reservations","completely negative","indifferent"],a:1,e:"Weigh the whole comment rather than seizing the first adjective."},
{q:"'I wouldn't put it quite like that.' The speaker is…",o:["agreeing","politely disagreeing","refusing to answer","confused"],a:1,e:"Polite disagreement is indirect but clear — a common Paper 2 focus."}
]},

{id:"u4l4",t:"Note completion and word limits",m:9,
obj:["Write answers of the right length","Spell key words accurately"],
html:`<p>Gap-fill and note-completion answers are usually one to three words or a number. Longer answers are marked wrong.</p>
<h4>Copy the speaker, not yourself</h4>
<p>Where the recording gives you a word, use that word. Do not paraphrase in this exercise — accuracy matters more than elegance.</p>
<h4>Spelling counts</h4>
<p>If the answer is a name or a place, the speaker will almost always <b>spell it out</b> — "Okonkwo, that's O-K-O-N-K-W-O". That spelling is a gift: it marks the answer <i>and</i> gives you the letters.</p>
<h4>Numbers, dates and times</h4>
<ul>
<li>Write times exactly as you hear them: <i>5.30</i> or <i>half past five</i>.</li>
<li>Numbers are usually repeated: "forty-seven — that's four-seven".</li>
<li>Watch for calculations: "Doors open at six; the film begins at six forty-five" — the question may ask for the <i>gap</i>.</li>
</ul>
<div class="note b"><b>The word limit is absolute</b>"No more than THREE words" means three. A correct idea in five words scores zero.</div>`,
check:[
{q:"The instruction says 'no more than THREE words'. You write five. Result?",o:["Still correct","Marked wrong","Extra credit","The examiner picks three"],a:1,e:"Word limits are part of the test and are applied strictly."},
{q:"The speaker spells out a surname letter by letter. This usually means…",o:["it is unimportant","it is the answer","the recording is ending","you should ignore it"],a:1,e:"Spelling and repetition are the recording's way of marking the answer."}
]}
]},

{id:"u5",t:"Speaking Skills",sub:"The interview, the talk and the discussion",ic:"🗣️",lessons:[

{id:"u5l1",t:"How the speaking test runs",m:9,
obj:["Describe the three parts of the test","Know what the examiner is listening for"],
html:`<p>Ten to fifteen minutes with your own teacher, recorded and later moderated by Cambridge. It is a <b>conversation</b>, not a performance.</p>
<h4>The three parts</h4>
<ol>
<li><b>Warm-up interview</b> — simple questions about you. <b>Not assessed.</b> Use it to relax and get your English moving.</li>
<li><b>The short talk</b> — you receive a topic card, get preparation time, then speak.</li>
<li><b>The discussion</b> — the examiner develops the topic with you. This is where the highest marks live.</li>
</ol>
<h4>What is assessed</h4>
<ul>
<li><b>Structure</b> — range and accuracy of grammar. Can you use more than the present simple?</li>
<li><b>Vocabulary</b> — variety and precision, not just correctness.</li>
<li><b>Development and fluency</b> — do you extend your answers and keep talking naturally?</li>
</ul>
<div class="note a"><b>The number one mistake</b>One-word answers. "Do you like sport?" — "Yes." That answer cannot be given a good mark because it contains no language to assess.</div>
<div class="note o"><b>Instead</b>"Yes, I do — football especially. I've played since I was seven, and honestly it's the only thing that clears my head after a long school day."</div>`,
check:[
{q:"The warm-up conversation is…",o:["marked strictly","not assessed — it is there to relax you","a reading test","the most important part"],a:1,e:"Use it to settle your nerves and get your English flowing."},
{q:"The speaking test assesses structure, vocabulary and…",o:["handwriting","development and fluency","spelling","reading speed"],a:1,e:"Development and fluency reward extended, natural answers."}
]},

{id:"u5l2",t:"Extending every answer",m:12,
obj:["Use the three-part answer formula","Avoid one-word replies"],
html:`<p>There is one formula that will carry you through the whole test.</p>
<div class="note"><b>Opinion → Reason → Example</b>
<i>"I prefer studying alone <b>(opinion)</b>, mainly because I concentrate far better in silence <b>(reason)</b>. Last month I revised for my science test in the library rather than at home, and I remembered almost twice as much <b>(example)</b>."</i></div>
<h4>Then add a fourth move: the qualification</h4>
<p>The strongest candidates add an exception or a limit. It shows genuine thinking and produces complex grammar naturally.</p>
<p><i>"…although for revision a group does help, because we test each other."</i></p>
<h4>Turn closed questions into open ones</h4>
<p>If the examiner asks a yes/no question, answer it and keep going. Never wait to be asked "why".</p>
<h4>Useful extenders</h4>
<ul>
<li><i>…which reminds me of…</i></li>
<li><i>…and that's especially true in my country, where…</i></li>
<li><i>…on the other hand, some people would argue…</i></li>
<li><i>…take my own school, for instance…</i></li>
</ul>`,
check:[
{q:"The three-part answer formula is…",o:["Opinion, reason, example","Question, answer, silence","Yes, no, maybe","Fact, fact, fact"],a:0,e:"Opinion, reason and example give the examiner enough language to reward."},
{q:"Which answer would score highest?",o:["Alone.","Alone, I suppose.","Alone, mostly — I concentrate better in silence, although for revision a group helps because we test each other.","I don't mind."],a:2,e:"Preference, reason and a qualifying exception together demonstrate real range."}
]},

{id:"u5l3",t:"The topic card",m:11,
obj:["Use preparation time effectively","Structure a 90-second talk"],
html:`<p>You get a card with a topic and some prompts, plus a short time to prepare. What you do with that time matters enormously.</p>
<h4>Do NOT write a speech</h4>
<p>Reading aloud sounds unnatural, kills fluency and loses marks. The examiner can always tell.</p>
<h4>DO note three or four ideas</h4>
<p>Single words or short phrases, each with an example attached. Three good ideas with examples will comfortably fill ninety seconds.</p>
<div class="note o"><b>Example plan — topic: "Living in a city"</b>
• transport — <i>metro, never need a car</i><br>
• opportunities — <i>my cousin found work in a week</i><br>
• downside: noise + cost — <i>our rent doubled in three years</i><br>
• but — <i>I'd still choose it over a village</i></div>
<h4>Structure your talk</h4>
<ol>
<li>Say what you are going to talk about (one sentence).</li>
<li>Idea one with an example.</li>
<li>Idea two with an example.</li>
<li>A contrasting point or a downside.</li>
<li>A short conclusion — your overall view.</li>
</ol>
<h4>If you run out of things to say</h4>
<p>Move to a personal example. "Actually, this happened to my own family last year…" A story is always longer than an opinion.</p>`,
check:[
{q:"In the preparation time you should…",o:["write a full speech to read","note three or four ideas with examples","memorise a paragraph","do nothing"],a:1,e:"Notes of ideas keep the talk natural; reading aloud loses fluency marks."},
{q:"You run out of things to say. The best rescue is…",o:["stop talking","give a personal example or short story","repeat the question","speak in your own language"],a:1,e:"A specific anecdote naturally produces more language than an abstract opinion."}
]},

{id:"u5l4",t:"Fluency strategies",m:11,
obj:["Buy thinking time in English","Handle a word you cannot remember"],
html:`<p>Fluency does not mean speaking fast. It means keeping going. These strategies are what fluent speakers actually do.</p>
<h4>Buying time</h4>
<ul>
<li><i>That's an interesting question — let me think for a moment.</i></li>
<li><i>Well, it depends really…</i></li>
<li><i>I've never thought about it that way, but I suppose…</i></li>
</ul>
<p>Silence loses marks. These phrases keep you speaking English while your brain catches up.</p>
<h4>When a word will not come — circumlocution</h4>
<p>Describe it instead. This is a <b>skill</b>, not a failure, and examiners reward it.</p>
<div class="note"><i>"I don't know the word in English — it's the thing you use to open a bottle of wine."</i> That is a successful communicator.</div>
<h4>Asking for clarification</h4>
<ul>
<li><i>Sorry, could you repeat that, please?</i></li>
<li><i>Sorry, do you mean…?</i></li>
</ul>
<p>Perfectly acceptable and it shows interactive competence.</p>
<h4>Self-correction</h4>
<p>If you make a mistake, correct it briefly and carry on: "he go — <i>goes</i> — to the gym". Do not apologise at length; that breaks the flow far worse than the error did.</p>
<h4>Disagreeing politely</h4>
<p><i>"I see what you mean, but personally I'd argue that…"</i> — soften first, then challenge.</p>`,
check:[
{q:"You cannot remember a word. The best strategy is…",o:["stay silent","describe it in other words","use your own language","stop the test"],a:1,e:"Circumlocution keeps communication going and is rewarded."},
{q:"You make a grammar mistake mid-sentence. You should…",o:["apologise at length","self-correct briefly and carry on","start the answer again","say nothing more"],a:1,e:"A quick self-correction shows awareness; long apologies damage fluency."}
]}
]},

{id:"u6",t:"Language Foundations",sub:"The grammar and vocabulary that carry marks",ic:"🔧",lessons:[

{id:"u6l1",t:"Tenses that examiners look for",m:14,
obj:["Use a range of tenses accurately","Avoid the three commonest tense errors"],
html:`<p>You do not need every tense in English. You need about eight, used accurately, plus the confidence to reach for a complex one when it fits.</p>
<h4>The core eight</h4>
<ul>
<li><b>Present simple</b> — habits, facts. <i>She walks to school.</i></li>
<li><b>Present continuous</b> — now, temporary. <i>Look! The bus is coming.</i></li>
<li><b>Past simple</b> — finished time. <i>We went to Dubai last summer.</i></li>
<li><b>Past continuous</b> — background action. <i>I was reading when the lights went out.</i></li>
<li><b>Present perfect</b> — past with present relevance. <i>I have finished, so I can rest.</i></li>
<li><b>Present perfect continuous</b> — duration up to now. <i>She has been studying for three hours.</i></li>
<li><b>Past perfect</b> — earlier past. <i>By the time we arrived, the film had started.</i></li>
<li><b>Future forms</b> — <i>will</i> (decision/prediction), <i>going to</i> (plan), present continuous (arrangement).</li>
</ul>
<h4>The three errors that cost most marks</h4>
<ol>
<li><b>Past simple vs present perfect.</b> A finished time expression (<i>yesterday, last year, in 2019</i>) forces the past simple. Never <i>I have gone yesterday</i>.</li>
<li><b>Third person -s.</b> <i>He go</i> → <i>he goes</i>. Simple, and constantly wrong under pressure.</li>
<li><b>Since vs for.</b> <i>since</i> + a point in time (2019, Monday); <i>for</i> + a length (three years, an hour).</li>
</ol>
<div class="note o"><b>To show range in writing</b>Deliberately include one past perfect and one conditional in every piece. It takes ten seconds and it is directly rewarded.</div>`,
check:[
{q:"'We ____ to Dubai last summer.'",o:["have gone","go","went","are going"],a:2,e:"A finished time expression requires the past simple."},
{q:"'By the time the ambulance arrived, the driver ____ the man out of the car.'",o:["pulled","had pulled","was pulling","has pulled"],a:1,e:"The past perfect shows which action happened first."},
{q:"'She has been living here ____ 2019.'",o:["for","since","from","during"],a:1,e:"'Since' + a point in time; 'for' + a length of time."}
]},

{id:"u6l2",t:"Conditionals",m:12,
obj:["Use the four conditionals correctly","Recognise 'unless' and 'if I were you'"],
html:`<p>Conditionals are the fastest way to show grammatical range in both writing and speaking.</p>
<h4>The four patterns</h4>
<ul>
<li><b>Zero</b> — general truth. <i>If you heat ice, it melts.</i> (present + present)</li>
<li><b>First</b> — likely future. <i>If it rains tomorrow, we will cancel.</i> (present + will)</li>
<li><b>Second</b> — unreal / imaginary. <i>If I had more time, I would learn the piano.</i> (past + would)</li>
<li><b>Third</b> — regret about the past. <i>If she had revised harder, she would have passed.</i> (past perfect + would have)</li>
</ul>
<div class="note b"><b>Never</b> put <i>will</i> in the if-clause. ❌ <i>If it will rain…</i></div>
<h4>Two expressions worth memorising</h4>
<ul>
<li><b>If I were you, I would…</b> — the standard way to give advice.</li>
<li><b>Unless</b> = if…not. <i>Unless you hurry, you will miss the train.</i> The main clause stays positive.</li>
</ul>
<h4>Where to use them</h4>
<p>Speaking: <i>"If they ever closed our library, the whole neighbourhood would miss it."</i><br>
Writing: <i>"If the council had consulted residents, this dispute would never have arisen."</i></p>`,
check:[
{q:"'If it ____ tomorrow, we will cancel the trip.'",o:["rains","will rain","rained","would rain"],a:0,e:"First conditional: if + present simple, will + infinitive."},
{q:"'If she had revised harder, she ____ the exam.'",o:["would pass","will pass","would have passed","passed"],a:2,e:"Third conditional: if + past perfect, would have + past participle."},
{q:"'Unless you hurry, you ____ the train.'",o:["will miss","won't miss","would miss","missed"],a:0,e:"'Unless' already means 'if not', so the main clause stays positive."}
]},

{id:"u6l3",t:"The passive voice",m:10,
obj:["Form the passive in the main tenses","Know when the passive is the better choice"],
html:`<p>The passive moves the focus from <i>who did it</i> to <i>what happened</i>. Reports, news and formal writing use it constantly.</p>
<h4>The formula</h4>
<p><b>be</b> (in the right tense) + <b>past participle</b></p>
<ul>
<li>Present: <i>The classroom <b>is cleaned</b> every evening.</i></li>
<li>Past: <i>The bridge <b>was built</b> in 1954.</i></li>
<li>Present perfect: <i>The results <b>have been sent</b> to all parents.</i></li>
<li>Future: <i>The library <b>will be opened</b> next March.</i></li>
<li>Modal: <i>Phones <b>must be switched off</b>.</i></li>
</ul>
<h4>When to choose it</h4>
<ul>
<li>The doer is unknown: <i>My bag has been stolen.</i></li>
<li>The doer is obvious or unimportant: <i>The rubbish is collected on Tuesdays.</i></li>
<li>You want a formal, impersonal tone: <i>It was decided that…</i></li>
</ul>
<div class="note a"><b>Do not overuse it</b>A whole paragraph in the passive becomes heavy and unclear. One or two well-placed passives in a report is exactly right.</div>`,
check:[
{q:"'The classroom ____ every evening by the cleaners.'",o:["cleans","is cleaned","is cleaning","cleaned"],a:1,e:"Present simple passive: is/are + past participle."},
{q:"'Somebody has stolen my bag.' → 'My bag ____ stolen.'",o:["has been","have been","is been","was been"],a:0,e:"Present perfect passive: has/have been + past participle."}
]},

{id:"u6l4",t:"Connectives and cohesion",m:11,
obj:["Choose the right connective for the job","Link paragraphs, not only sentences"],
html:`<p>Connectives are signposts. Using the wrong one is worse than using none, because it sends the reader in the wrong direction.</p>
<h4>The four jobs</h4>
<ul>
<li><b>Adding</b> — furthermore, in addition, moreover, what is more</li>
<li><b>Contrasting</b> — however, nevertheless, on the other hand, although</li>
<li><b>Showing result</b> — therefore, consequently, as a result, thus</li>
<li><b>Giving examples</b> — for instance, such as, take … for example</li>
</ul>
<h4>Grammar traps</h4>
<ul>
<li><b>Although</b> + clause: <i>Although it was raining, we went.</i></li>
<li><b>Despite / In spite of</b> + noun or -ing: <i>Despite the rain…</i> ❌ Never <i>despite of</i>.</li>
<li><b>However</b> starts a new sentence with a comma: <i>However, the scheme failed.</i></li>
</ul>
<h4>Cohesion beyond connectives</h4>
<ul>
<li><b>Pronouns</b> — <i>this problem, such measures, these findings</i></li>
<li><b>Topic sentences</b> — open each paragraph with its main idea.</li>
<li><b>Referring back</b> — <i>As mentioned above… / This brings me to…</i></li>
</ul>`,
check:[
{q:"'The scheme is expensive; ____, it saves lives.'",o:["therefore","however","moreover","for example"],a:1,e:"The two ideas contrast, so 'however' is correct."},
{q:"'____ the heavy traffic, we arrived on time.'",o:["Because of","Although","Despite","Even"],a:2,e:"'Despite' + noun phrase. 'Although' would need a full clause."},
{q:"Which is always WRONG?",o:["in spite of the rain","despite the rain","despite of the rain","although it rained"],a:2,e:"'Despite of' does not exist in English."}
]},

{id:"u6l5",t:"Word formation",m:11,
obj:["Build nouns, adjectives and adverbs from a root","Use negative prefixes correctly"],
html:`<p>One root word can become four or five words. Examiners test this directly, and it instantly widens your vocabulary.</p>
<h4>Common endings</h4>
<ul>
<li><b>Nouns</b>: -tion (construct → construction), -ment (develop → development), -ness (happy → happiness), -ity (able → ability)</li>
<li><b>Adjectives</b>: -ful (power → powerful), -able (sustain → sustainable), -ive (create → creative), -ous (danger → dangerous)</li>
<li><b>Adverbs</b>: -ly (emotional → emotionally)</li>
</ul>
<h4>Negative prefixes — choose carefully</h4>
<ul>
<li><b>un-</b> — unclear, unusual, unhappy</li>
<li><b>in-</b> — incorrect, invisible</li>
<li><b>im-</b> before m/p — impossible, impatient</li>
<li><b>ir-</b> before r — irrelevant, irregular</li>
<li><b>il-</b> before l — illegal, illogical</li>
<li><b>dis-</b> — dishonest, disagree</li>
</ul>
<h4>-ed and -ing adjectives</h4>
<div class="note"><b>The rule that fixes a very common error</b><i>-ing</i> describes the <b>thing</b>: <i>The film was boring.</i><br><i>-ed</i> describes the <b>person's feeling</b>: <i>I was bored.</i><br>"I am boring" means something quite different from what you intended!</div>`,
check:[
{q:"'His answer was completely ____ .' (RELEVANT)",o:["unrelevant","inrelevant","irrelevant","disrelevant"],a:2,e:"'ir-' is used before words beginning with r."},
{q:"'The film was very ____ .' (BORE)",o:["bored","boring","boredom","bore"],a:1,e:"-ing describes the thing; -ed describes how a person feels."},
{q:"'The ____ of the bridge took two years.' (CONSTRUCT)",o:["constructive","construction","constructed","constructing"],a:1,e:"Verb → noun with -ion."}
]},

{id:"u6l6",t:"Phrasal verbs and collocations",m:12,
obj:["Learn high-frequency phrasal verbs in context","Avoid the commonest collocation errors"],
html:`<p>Natural English runs on phrasal verbs and collocations. Getting them right makes your writing sound fluent rather than translated.</p>
<h4>Twelve you will meet again and again</h4>
<ul>
<li><b>give up</b> — stop a habit. <i>He gave up smoking.</i></li>
<li><b>look after</b> — take care of</li>
<li><b>take after</b> — resemble a relative</li>
<li><b>put off</b> — postpone</li>
<li><b>call off</b> — cancel</li>
<li><b>work out</b> — calculate, or solve</li>
<li><b>find out</b> — discover information</li>
<li><b>turn down</b> — refuse an offer</li>
<li><b>set off</b> — begin a journey</li>
<li><b>bring up</b> — raise a child</li>
<li><b>get over</b> — recover from</li>
<li><b>run out of</b> — have none left</li>
</ul>
<h4>Collocation errors that appear in almost every class</h4>
<ul>
<li>❌ make homework → ✅ <b>do</b> homework</li>
<li>❌ do a decision → ✅ <b>make</b> a decision</li>
<li>❌ make a research → ✅ <b>carry out</b> research (uncountable — no "a")</li>
<li>❌ strong rain → ✅ <b>heavy</b> rain</li>
<li>❌ discuss about → ✅ <b>discuss</b> (no preposition)</li>
<li>❌ I am agree → ✅ <b>I agree</b></li>
</ul>
<div class="note a"><b>How to learn them</b>Never learn a phrasal verb alone. Learn it inside a sentence you might actually say — the sentence is what your memory keeps.</div>`,
check:[
{q:"'The match was ____ off because of the flooded pitch.'",o:["put","called","turned","given"],a:1,e:"'Call off' = cancel an arranged event."},
{q:"Which collocation is correct?",o:["make homework","do homework","take homework","give homework to do"],a:1,e:"We DO homework; we MAKE decisions, plans and mistakes."},
{q:"Which is correct?",o:["We discussed about the problem.","We discussed the problem.","We discussed on the problem.","We discussed for the problem."],a:1,e:"'Discuss' is transitive and takes no preposition."}
]}
]},

{id:"u7",t:"Topic Worlds",sub:"The subject areas the exam draws on",ic:"🌍",lessons:[

{id:"u7l1",t:"Education and work",m:10,
obj:["Use topic vocabulary accurately","Develop arguments about school and careers"],
html:`<p>The most frequently examined topic area of all — you will almost certainly meet it in at least one paper.</p>
<h4>Vocabulary you should own</h4>
<p><b>School:</b> curriculum, timetable, syllabus, extra-curricular, tuition, boarding school, revision, deadline, coursework, peer pressure, exam stress.<br>
<b>Work:</b> apprenticeship, internship, qualifications, application, CV, interview, promotion, salary, working hours, career path, work experience.</p>
<h4>Arguments worth preparing</h4>
<ul>
<li><b>Uniform</b> — limits self-expression <i>vs</i> removes competition over clothing.</li>
<li><b>Homework</b> — extends the school day into the home <i>vs</i> independent practice fixes learning.</li>
<li><b>Exams vs coursework</b> — fair and comparable <i>vs</i> a single bad day decides everything.</li>
<li><b>University vs a trade</b> — deeper qualification <i>vs</i> earning and learning immediately.</li>
</ul>
<div class="note o"><b>Speaking gold</b>"Take my own school, for instance…" A specific personal example is always more convincing than a general claim, and it produces far more language.</div>`,
check:[
{q:"Which word means the full programme of subjects a school teaches?",o:["timetable","curriculum","deadline","tuition"],a:1,e:"The curriculum is the whole programme; the timetable is when lessons happen."},
{q:"Which is a balanced argument about homework?",o:["Homework is useless.","Homework is essential.","Although homework extends the school day, regular independent practice does fix classroom learning.","Everyone hates homework."],a:2,e:"Concession followed by your point is what earns high Content marks."}
]},

{id:"u7l2",t:"Environment and sustainability",m:10,
obj:["Use environmental vocabulary precisely","Structure a problem–solution argument"],
html:`<h4>Vocabulary</h4>
<p>pollution, emissions, carbon footprint, renewable energy, solar panels, deforestation, drought, flooding, recycling, single-use plastic, biodiversity, conservation, sustainable, landfill.</p>
<h4>Precision matters</h4>
<ul>
<li><b>Conserve</b> = protect and use carefully. <b>Preserve</b> = keep unchanged.</li>
<li><b>Effect</b> is the noun; <b>affect</b> is the verb. <i>The scheme had a serious effect. It affected everyone.</i></li>
<li><b>Soar</b> = rise steeply. <b>Plummet</b> = fall steeply. Both are excellent for describing data.</li>
</ul>
<h4>Problem–solution structure</h4>
<ol>
<li>State the problem with one concrete fact.</li>
<li>Explain the cause.</li>
<li>Propose two realistic solutions.</li>
<li>Acknowledge the difficulty of one of them.</li>
</ol>
<div class="note"><b>Model sentence</b><i>"Although installing solar panels is expensive at the outset, the cost is recovered within a decade — and the panels last for twenty years."</i></div>`,
check:[
{q:"'Pollution levels have soared.' This means they have…",o:["fallen slightly","stayed the same","risen very quickly","been measured"],a:2,e:"'Soar' means to rise rapidly to a high level."},
{q:"Which is correct?",o:["The scheme had a serious affect.","The scheme had a serious effect.","The scheme was affect.","The scheme effected people."],a:1,e:"'Effect' is the noun; 'affect' is the verb."}
]},

{id:"u7l3",t:"Technology and communication",m:10,
obj:["Discuss technology with balanced arguments","Use precise technology vocabulary"],
html:`<h4>Vocabulary</h4>
<p>device, application, screen time, social media, streaming, online safety, privacy, data, misinformation, cyberbullying, digital literacy, artificial intelligence, remote learning, notification.</p>
<h4>Balanced positions to prepare</h4>
<ul>
<li><b>Phones in school</b> — a research tool and a safety line <i>vs</i> the greatest distraction ever invented.</li>
<li><b>Social media</b> — connection across distance <i>vs</i> comparison, sleep loss and misinformation.</li>
<li><b>Online learning</b> — flexible and repeatable <i>vs</i> isolating and easy to avoid.</li>
</ul>
<h4>Hedging — the language of maturity</h4>
<p>Avoid absolute claims. Compare:</p>
<ul>
<li>❌ <i>Video games cause violence.</i></li>
<li>✅ <i>Video games may contribute to aggressive behaviour in some players.</i></li>
</ul>
<p>Useful hedges: <i>may, might, tend to, in some cases, it is often argued that, arguably</i>.</p>`,
check:[
{q:"Which sentence hedges appropriately?",o:["Social media destroys teenagers.","Social media may contribute to anxiety in some young people.","Everyone knows social media is bad.","Social media never causes harm."],a:1,e:"Hedging shows precise, mature argument and avoids claims you cannot support."},
{q:"Which word means false information spread online?",o:["privacy","misinformation","streaming","notification"],a:1,e:"Misinformation is false or misleading information."}
]},

{id:"u7l4",t:"Health, food and sport",m:9,
obj:["Use health vocabulary accurately","Give advice using appropriate structures"],
html:`<h4>Vocabulary</h4>
<p>balanced diet, nutrition, protein, processed food, portion, obesity, fitness, stamina, injury, recovery, wellbeing, sedentary, hydration, sleep pattern.</p>
<h4>Giving advice — four structures</h4>
<ul>
<li><i>You should…</i> (neutral)</li>
<li><i>It would be a good idea to…</i> (softer)</li>
<li><i>If I were you, I would…</i> (personal)</li>
<li><i>One way of tackling this is to…</i> (formal, good in reports)</li>
</ul>
<h4>Modals of obligation</h4>
<ul>
<li><b>must</b> — strong obligation, often a rule. <i>You must wear a helmet.</i></li>
<li><b>have to</b> — external necessity. <i>I have to be home by nine.</i></li>
<li><b>don't have to</b> — it is not necessary (<b>not</b> forbidden!)</li>
<li><b>mustn't</b> — it is forbidden.</li>
</ul>
<div class="note b"><b>The classic error</b><i>You mustn't bring a dictionary</i> means it is banned. If you mean it simply is not necessary, say <i>you don't have to bring one</i>.</div>`,
check:[
{q:"'You ____ bring your dictionary; there are plenty in the classroom.'",o:["mustn't","don't have to","shouldn't","can't"],a:1,e:"'Don't have to' = it is not necessary. 'Mustn't' means forbidden."},

{id:"u7l5",t:"Travel, tourism and places",m:9,
obj:["Describe places vividly","Weigh the effects of tourism"],
html:`<h4>Vocabulary</h4>
<p>destination, accommodation, itinerary, landmark, heritage site, local economy, overcrowding, off-season, backpacking, ecotourism, souvenir, hospitality.</p>
<h4>Describing a place well</h4>
<p>Weak description names things. Strong description gives one <b>specific sensory detail</b>.</p>
<ul>
<li>❌ <i>The market was busy and interesting.</i></li>
<li>✅ <i>The market smelled of cardamom and diesel, and you could not walk three metres without someone offering you tea.</i></li>
</ul>
<h4>Tourism: both sides</h4>
<ul>
<li><b>For</b> — employment, investment in infrastructure, preservation of crafts, cultural exchange.</li>
<li><b>Against</b> — overcrowding, rising local prices, environmental damage, seasonal and insecure jobs.</li>
</ul>
<div class="note"><b>A summary-ready sentence</b><i>"While tourism undoubtedly brings money into the local economy, residents pay for it in higher rents and crowded streets."</i></div>`,
check:[
{q:"Which description is strongest?",o:["The beach was nice.","The beach was very nice and beautiful.","The beach was empty except for a fisherman mending a net the colour of rust.","The beach was a beach."],a:2,e:"One specific sensory detail is worth more than three general adjectives."},
{q:"Which is a DISADVANTAGE of tourism?",o:["employment","investment in roads","rising prices for local people","cultural exchange"],a:2,e:"Higher local costs are one of the standard arguments against mass tourism."}
]},

{id:"u7l6",t:"Society, customs and traditions",m:9,
obj:["Write respectfully about culture","Compare customs without judging"],
html:`<h4>Vocabulary</h4>
<p>custom, tradition, ceremony, hospitality, generation, community, identity, heritage, festival, etiquette, values, multicultural.</p>
<h4>Comparing cultures — language that stays respectful</h4>
<ul>
<li><i>In my country it is customary to…</i></li>
<li><i>Whereas in some cultures…, in others…</i></li>
<li><i>What strikes visitors most is…</i></li>
<li><i>This is gradually changing, particularly among younger people.</i></li>
</ul>
<div class="note a"><b>Avoid</b>Sweeping statements about any group ("All X people are…"). They weaken your argument and read badly. Use <i>many, most, tend to, generally</i>.</div>
<h4>Change over generations — a rich exam theme</h4>
<p>Almost any custom question can be developed by asking: how was it in my grandparents' time, how is it now, and why did it change? That single move gives you past tenses, present tenses and a reason — plenty of language to be rewarded for.</p>`,
check:[
{q:"Which phrase is most appropriate when describing another culture?",o:["They all do…","Everyone there is…","In many families it is customary to…","Their customs are strange."],a:2,e:"Qualified language is both more accurate and more respectful."},
{q:"Which question best develops a custom topic?",o:["Do you like it?","How was it in my grandparents' time, how is it now, and why did it change?","Is it good or bad?","What is it called?"],a:1,e:"The generational comparison produces past and present tenses plus reasons."}
]}
]},

{id:"u8",t:"Exam Countdown",sub:"The last four weeks",ic:"🏁",lessons:[

{id:"u8l1",t:"A four-week revision plan",m:9,
obj:["Structure the final month","Balance the four skills"],
html:`<h4>Week 1 — diagnose</h4>
<p>Sit one full mock of each paper. Do not revise first: you are finding out where you actually are. Record your weakest exercise type.</p>
<h4>Week 2 — attack weaknesses</h4>
<p>Spend 70% of your time on your two weakest exercise types. It is uncomfortable, which is exactly why it works. Keep 30% for vocabulary flashcards.</p>
<h4>Week 3 — timed practice</h4>
<p>Everything under exam conditions. No pausing, no dictionary. Mark honestly against the criteria.</p>
<h4>Week 4 — consolidate and rest</h4>
<p>Review your personal error list. Re-read your best pieces of writing. Practise speaking aloud daily. Sleep properly — a tired brain loses more marks than a small gap in knowledge.</p>
<div class="note o"><b>Every single day, all four weeks</b>Ten minutes of vocabulary flashcards and five minutes of speaking English aloud. These two habits improve every paper simultaneously.</div>`,
check:[
{q:"What should you do in the first week of revision?",o:["Revise everything","Sit mocks to diagnose your weaknesses","Only vocabulary","Rest"],a:1,e:"You cannot target your revision until you know where you are actually losing marks."},
{q:"Which two daily habits improve every paper at once?",o:["Copying notes and highlighting","Vocabulary flashcards and speaking aloud","Reading in your own language and sleeping","Watching films with subtitles in your language"],a:1,e:"Vocabulary and spoken practice feed reading, writing, listening and speaking together."}
]},

{id:"u8l2",t:"Timing in each paper",m:9,
obj:["Allocate time per exercise","Recover when you fall behind"],
html:`<h4>Paper 1 — Reading and Writing (2 hours, 60 marks)</h4>
<p>A simple guide: roughly a minute per mark, plus planning and checking time. Reading exercises are quick marks — do not let them eat the time your writing needs.</p>
<ul>
<li>Reading exercises: about 55–60 minutes total</li>
<li>Writing exercise 1: about 25 minutes (5 plan, 15 write, 5 check)</li>
<li>Writing exercise 2: about 30 minutes (5 plan, 20 write, 5 check)</li>
</ul>
<h4>Paper 2 — Listening</h4>
<p>The timing is controlled for you. Your only job is to use the pauses to read ahead and the transfer time to check spelling.</p>
<h4>If you fall behind</h4>
<ol>
<li>Never skip a whole writing task to finish a reading exercise. Writing carries far more marks per minute at that point.</li>
<li>Write brief but clear points rather than nothing. Partial answers score partial marks; blanks score none.</li>
<li>Leave the hardest single question and come back only if time allows.</li>
</ol>`,
check:[
{q:"You have five minutes left and one writing task unfinished. Best action?",o:["Leave it blank","Write brief but clear points covering the remaining content","Rewrite what you already wrote","Check the reading answers again"],a:1,e:"Partial answers score partial marks; blanks score none."},
{q:"Roughly how should you split a writing task?",o:["All writing","Plan a little, write most, check at the end","Half planning","Half checking"],a:1,e:"About 5 minutes planning, most of the time writing, 5 minutes checking."}
]},

{id:"u8l3",t:"The night before and the day itself",m:7,
obj:["Prepare practically","Manage exam nerves"],
html:`<h4>The night before</h4>
<ul>
<li>Read your personal error list once. Do not learn anything new.</li>
<li>Pack: two pens, a pencil, your ID, a watch you can read.</li>
<li>Sleep. Genuinely — this is worth more than two hours of cramming.</li>
</ul>
<h4>In the exam room</h4>
<ol>
<li>Read the whole paper first — 60 seconds. You will start thinking about the writing tasks while you do the reading.</li>
<li>Underline instruction words as you go.</li>
<li>Keep an eye on the clock at fixed points, not constantly.</li>
<li>Leave five minutes at the end. Always.</li>
</ol>
<h4>If your mind goes blank</h4>
<p>Put your pen down, breathe out slowly twice, and start with the easiest question on the page. Momentum returns quickly — the blankness is nerves, not lost knowledge.</p>
<div class="note o"><b>Remember</b>You have prepared for this. The examiner is looking for what you <i>can</i> do, not hunting for what you cannot.</div>`,
check:[
{q:"The best thing to do the night before is…",o:["learn a new grammar topic","read your error list and sleep properly","stay up revising","nothing at all"],a:1,e:"Sleep protects recall far more effectively than late cramming."},
{q:"Your mind goes blank. You should…",o:["leave the room","breathe and start with the easiest question","stare at the hardest question","give up"],a:1,e:"Starting with something easy restores momentum quickly."}
]}
]}
];

{id:"r1",t:"The Return of the Otters",topic:"Environment",lvl:"Standard",m:12,
text:`For most of the twentieth century the River Kelvin was treated as little more than a drain. Factories along its banks poured waste directly into the water; the local council, short of space, dumped rubbish on the slopes above it. By 1975 a survey found no fish at all along a six-kilometre stretch, and residents had stopped walking beside it altogether.

The change began, as changes often do, with a small group of people who refused to accept the situation. A group of retired teachers formed the Kelvin Trust in 1988 and began, at first with almost no money, to remove rubbish by hand. Their real achievement, however, was not the clearing but the campaigning: within four years they had persuaded the council to fund proper waste treatment and had brought three separate factories to court.

Progress was slow. Water quality improved measurably by 1996, but the first fish did not reappear until 2003. What surprised everyone was what followed. In the spring of 2011, a schoolgirl walking to class photographed an otter on the riverbank — the first recorded in the city for over ninety years.

Today the river supports a healthy population of otters, kingfishers and brown trout, and the path beside it is used by an estimated two thousand people every day. The Trust, now run largely by volunteers in their twenties, has turned its attention to the smaller streams that feed the Kelvin. "People assume this took a scientific breakthrough," its current director says. "It took nothing of the kind. It took thirty years of ordinary people being extremely stubborn."`,

{id:"r3",t:"The Girl Who Hated the Sea",topic:"Narrative",lvl:"Higher",m:13,
text:`Fatima had always hated the sea. As a child she had refused even to paddle, and on the one family holiday to the coast she had spent four days sitting under a tree with a book, ignoring the water entirely and her brothers completely.

So when the letter arrived offering her a place on the marine biology course, her hands trembled as she read it twice.

Her mother, who had filled in the application form on her behalf in a moment of what she now called optimism and Fatima called betrayal, said nothing at all. She simply put the kettle on and waited, which was her most effective form of argument.

"I can't swim properly," Fatima said at last.
"They teach you."
"I don't like boats."
"You've never been on one."

There was a long silence, filled only by the sound of water beginning to move in the kettle.

"It's four hundred kilometres away," Fatima said, and her mother, who had been waiting patiently for exactly this sentence, understood that her daughter had already decided to go. The objections had moved from the sea to the distance, and distance was a problem that could be solved.

Eighteen months later, Fatima stood on the deck of a research vessel at four in the morning, soaked to the skin, counting turtles by torchlight, and could not remember with any conviction what it was she had once been so frightened of.`,
qs:[
{type:"mcq",q:"Why does the writer tell us at the start that Fatima hated the sea?",o:["To explain her career choice","To create a contrast that makes the letter surprising","To show she was lazy","To describe the weather"],a:1,e:"Placing the hatred beside the marine biology offer creates the contrast that drives the whole story."},
{type:"mcq",q:"What does 'a moment of what she now called optimism and Fatima called betrayal' tell us?",o:["They agree about the decision","Mother and daughter see the same act very differently","The mother regrets it","Fatima was pleased"],a:1,e:"The same action has two opposite names depending on who is speaking — a compact way of showing conflict."},
{type:"mcq",q:"Why does the mother say nothing and put the kettle on?",o:["She is not interested","Silence is her most effective argument","She is angry","She wants tea"],a:1,e:"The text states directly that waiting 'was her most effective form of argument'."},
{type:"mcq",q:"How does the mother know Fatima has decided to go?",o:["Fatima says so","The objections have moved from the sea to the distance","Fatima packs a bag","The letter says so"],a:1,e:"The objection has shifted to a solvable practical problem, which signals the real decision is made."},
{type:"short",q:"In ONE word, how does Fatima feel at the very end?",ans:["changed","transformed","confident","happy","fulfilled","comfortable","different"],e:"She cannot remember what frightened her — she has been transformed. Any sensible adjective supported by the text is acceptable."},
{type:"mcq",q:"The final paragraph is effective mainly because it…",o:["describes the weather","shows the complete reversal without stating it","lists scientific facts","introduces a new character"],a:1,e:"The reversal is shown through the image of her at sea at 4 a.m., not announced."}
]},

{id:"r4",t:"Should Cities Ban Cars?",topic:"Society",lvl:"Higher",m:13,
text:`Supporters of car-free city centres point to results that are difficult to argue with. In the eight European cities that have introduced full restrictions since 2015, air quality has improved measurably within eighteen months, and pedestrian injuries have fallen by an average of forty per cent. Retailers, who almost universally opposed the schemes beforehand, have in most cases reported higher footfall afterwards.

Opponents, however, raise objections that are rarely addressed honestly by campaigners. Delivery drivers face longer routes and tighter time windows. Families living just outside the restricted zone often find that traffic simply moves onto their street rather than disappearing. Above all, people with limited mobility — for whom a car is not a luxury but the difference between independence and isolation — are frequently forgotten in the planning stage.

The most successful schemes appear to be those that treat the ban as the last step rather than the first. Cities that spent three or four years improving bus frequency, building protected cycle lanes and creating exemptions for residents with disabilities have met far less resistance than those that simply closed the roads and hoped.

What is clear is that the debate has changed. Ten years ago the question was whether city centres should be reclaimed from traffic at all. Today, in most European capitals, the question is only how quickly it should happen and who should be protected while it does.`,
qs:[
{type:"mcq",q:"What surprised retailers about the schemes?",o:["Air quality improved","Footfall increased after the ban","Deliveries became easier","Injuries rose"],a:1,e:"They opposed the schemes beforehand but 'reported higher footfall afterwards'."},
{type:"mcq",q:"Which objection does the writer suggest is most serious?",o:["Delivery routes","Traffic moving to nearby streets","The exclusion of people with limited mobility","Retail opposition"],a:2,e:"'Above all' signals the writer's ranking — mobility is presented as the most serious issue."},
{type:"mcq",q:"According to the writer, successful schemes…",o:["ban cars immediately","prepare alternatives for years before the ban","never allow exemptions","ignore public opinion"],a:1,e:"Cities that improved transport first 'have met far less resistance'."},
{type:"mcq",q:"What does 'closed the roads and hoped' imply about those cities?",o:["They planned carefully","They acted without adequate preparation","They consulted residents","They succeeded easily"],a:1,e:"The word 'hoped' implies a lack of planning — criticism expressed through word choice."},
{type:"short",q:"How has the debate changed, according to the final paragraph? Answer briefly in your own words.",ans:["from whether to how quickly","it is now about how fast not whether","the question is now how soon","from if to when","from whether it should happen to how quickly"],e:"The question has shifted from 'whether' to 'how quickly and who should be protected'."},
{type:"mcq",q:"The writer's overall position is best described as…",o:["strongly opposed to car-free centres","supportive but insistent that objections be taken seriously","neutral with no view","only interested in retailers"],a:1,e:"The writer accepts the benefits but devotes a full paragraph to objections 'rarely addressed honestly'."}
]},

{id:"r6",t:"The Four-Day Week",topic:"Work",lvl:"Higher",m:12,
text:`When a mid-sized software company in Cardiff moved its ninety staff to a four-day week in 2022, the managing director expected to lose money. Two years on, revenue is up eleven per cent, staff turnover has fallen from nineteen per cent to four, and the company has stopped advertising vacancies altogether — it now receives more speculative applications than it can read.

The mechanism, according to the company, is not magic. Meetings were cut from an average of eleven hours a week per employee to three. Email was largely replaced by a shared task board. Nobody, the director insists, is working harder; they are simply working on fewer things at once.

Not every sector reports the same result. A trial in a chain of care homes was abandoned after seven months: staffing a building twenty-four hours a day with four-day contracts required hiring additional workers, and the additional wage bill could not be absorbed. Similar difficulties have appeared in retail and hospitality, where the work cannot be compressed because it is defined by opening hours rather than by output.

The emerging picture, then, is not that the four-day week succeeds or fails, but that it succeeds where output can be measured and compressed, and struggles where the job is defined by presence. That distinction — between paying for hours and paying for results — may prove to be the more important legacy of the experiment.`,
qs:[
{type:"mcq",q:"What did the managing director expect to happen?",o:["Revenue would rise","The company would lose money","Staff would leave","Nothing would change"],a:1,e:"'the managing director expected to lose money' — the opposite of what occurred."},
{type:"mcq",q:"Why has the company stopped advertising vacancies?",o:["It has no jobs","It receives more applications than it can read","It cannot afford advertising","It is closing"],a:1,e:"Unsolicited applications now exceed what they can process."},
{type:"mcq",q:"Why did the care home trial fail?",o:["Staff disliked it","Buildings need 24-hour cover, so extra staff had to be hired","Residents complained","The government banned it"],a:1,e:"Round-the-clock staffing required additional workers and an unaffordable wage bill."},
{type:"short",q:"In your own words, in which kind of job does the four-day week work best?",ans:["jobs where output can be measured","where results matter not hours","jobs measured by output","where work can be compressed","output-based jobs","jobs paid for results"],e:"It works where output can be measured and compressed, rather than where the job is defined by presence."},
{type:"mcq",q:"What does the writer suggest is the most important lesson?",o:["Everyone should work four days","The difference between paying for hours and paying for results","Care homes should close","Meetings are useless"],a:1,e:"The final sentence identifies this distinction as 'the more important legacy'."},
{type:"mcq",q:"'Nobody is working harder; they are simply working on fewer things at once.' This suggests the gain came from…",o:["longer hours","reduced multitasking and fewer meetings","new technology","hiring more staff"],a:1,e:"Meetings were cut and focus increased — not effort."}
]}

{id:"l3",t:"A Talk on Sleep",topic:"Health",lvl:"Higher",m:10,
intro:"You will hear part of a talk given to students about sleep.",
script:`Good morning. I want to begin with a figure that surprises most people. Teenagers need between eight and ten hours of sleep a night. Not seven. Not the six that many of you are managing during exam season.
Now, the interesting part is not the number itself, but what happens when you don't reach it. Most people assume that losing sleep simply makes you tired. In fact, the first thing that suffers is not energy at all — it's memory consolidation. Put simply, the material you revised at eleven o'clock at night is stored properly only while you sleep. Skip the sleep, and a good deal of that revision is genuinely lost.
There's a second effect that's less well known. Sleep deprivation affects your judgement of your own performance. Tired students consistently rate their work as better than it is — which is precisely why a tired brain doesn't notice it's making mistakes.
So my advice, and I realise it sounds like something your parents would say, is this: an extra hour of sleep before an exam is usually worth more than an extra hour of revision. Not always. But usually.`,
qs:[

script:`Speaker one. Honestly, I was against it at first. I run a small shop on that road and I assumed losing the parking spaces would finish us. But what actually happened was the opposite. People walk past now, and people who walk past come in. Deliveries are harder, I'll admit that — my supplier has to arrive before eight — but on balance I'd say it's been good for the street.
