<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<meta name="description" content="IGCSE Educational Platform - a complete learning platform for Cambridge IGCSE English as a Second Language 0510 / 0511.">
<title>IGCSE Educational Platform</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127891;</text></svg>">
<style>
:root{
  --bg:#f5f6fb; --surf:#ffffff; --surf2:#f0f2f9; --line:#e3e6f0;
  --txt:#0f172a; --dim:#64748b; --faint:#94a3b8;
  --pri:#4f46e5; --pri2:#6366f1; --priS:rgba(79,70,229,.10);
  --acc:#f59e0b; --accS:rgba(245,158,11,.12);
  --ok:#10b981; --okS:rgba(16,185,129,.12);
  --bad:#ef4444; --badS:rgba(239,68,68,.10);
  --info:#0ea5e9; --infoS:rgba(14,165,233,.12);
  --sh:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
  --sh2:0 10px 40px rgba(15,23,42,.14);
  --r:16px; --rs:12px;
  --sb:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#0b1020; --surf:#141a2e; --surf2:#1b2338; --line:#28304a;
  --txt:#eef2ff; --dim:#a2adc9; --faint:#7b87a6;
  --pri:#818cf8; --pri2:#a5b4fc; --priS:rgba(129,140,248,.14);
  --accS:rgba(245,158,11,.16); --okS:rgba(16,185,129,.16);
  --badS:rgba(239,68,68,.16); --infoS:rgba(14,165,233,.16);
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --sh2:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%;
  transition:background .25s,color .25s;overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
a{color:var(--pri);text-decoration:none}
::selection{background:var(--pri);color:#fff}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:0 0 10px}

/* ================= layout ================= */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding-bottom:calc(78px + var(--sb))}
.pad{max-width:960px;margin:0 auto;padding:14px 14px 24px}

@media(min-width:900px){
  .side{display:flex;flex-direction:column;width:250px;flex:none;position:sticky;top:0;height:100vh;
    background:var(--surf);border-right:1px solid var(--line);padding:18px 12px;gap:4px;overflow-y:auto}
  .main{padding-bottom:30px}
  .tabbar{display:none!important}
  .pad{padding:24px 28px 40px}
}

/* brand */
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;cursor:pointer}
.brand .mk{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 18px var(--priS)}
.brand b{display:block;font-size:14.5px;letter-spacing:-.2px;line-height:1.15}
.brand small{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}

.navb{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;font-size:14px;font-weight:600;
  color:var(--dim);width:100%;text-align:left;transition:.15s}
.navb .i{font-size:17px;width:22px;text-align:center}
.navb:hover{background:var(--surf2);color:var(--txt)}
.navb.on{background:var(--priS);color:var(--pri)}
.navsec{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);
  font-weight:800;padding:16px 13px 6px}

/* top bar (mobile) */
.top{position:sticky;top:0;z-index:40;background:var(--surf);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
@media(min-width:900px){.top{display:none}}
.top .mk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.top b{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bottom tabs (mobile) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surf);
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--sb))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;
  font-size:10px;font-weight:700;color:var(--faint);border-radius:11px;transition:.15s}
.tabbar button .i{font-size:19px;line-height:1}
.tabbar button.on{color:var(--pri)}
.tabbar button.on .i{transform:translateY(-1px)}

/* ================= components ================= */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.hd h3{font-size:16px}
.hd .lk{font-size:12.5px;font-weight:700;color:var(--pri)}
.sub{color:var(--dim);font-size:13px;line-height:1.6}
.tiny{font-size:11.5px;color:var(--faint)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
.g3f{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrapf{display:flex;flex-wrap:wrap;gap:8px}
.hide{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:13px;
  font-weight:700;font-size:14.5px;background:var(--surf2);color:var(--txt);border:1px solid var(--line);
  transition:transform .12s,filter .15s;width:100%}
.btn:active{transform:scale(.975)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;
  box-shadow:0 8px 20px var(--priS)}
.btn.acc{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#3a2500;border-color:transparent}
.btn.ok{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border-color:transparent}
.btn.dg{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border-color:transparent}
.btn.gh{background:transparent}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.auto{width:auto}

.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:11.5px;
  font-weight:700;background:var(--surf2);color:var(--dim);border:1px solid var(--line);white-space:nowrap}
.pill.p{background:var(--priS);color:var(--pri);border-color:transparent}
.pill.a{background:var(--accS);color:#b45309;border-color:transparent}
.pill.o{background:var(--okS);color:#047857;border-color:transparent}
.pill.i{background:var(--infoS);color:#0369a1;border-color:transparent}
[data-theme="dark"] .pill.a{color:#fcd34d}
[data-theme="dark"] .pill.o{color:#6ee7b7}
[data-theme="dark"] .pill.i{color:#7dd3fc}

.bar{height:8px;border-radius:8px;background:var(--surf2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--pri),var(--pri2));
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.ok i{background:linear-gradient(90deg,#059669,#34d399)}
.bar.acc i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}

.inp{width:100%;padding:13px 14px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);
  outline:none;font-size:16px;transition:.15s;color:var(--txt)}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--priS);background:var(--surf)}
textarea.inp{resize:vertical;line-height:1.65;font-size:15px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 19px) 21px,calc(100% - 13px) 21px;background-size:6px 6px;background-repeat:no-repeat}
label.lb{display:block;font-size:11.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  color:var(--dim);margin:0 0 6px 2px}

.chip{padding:8px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line);
  font-size:13px;font-weight:600;transition:.15s;color:var(--txt)}
.chip.on{background:var(--pri);color:#fff;border-color:transparent}

/* progress ring */
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:23px;display:block}
.ring .v span{font-size:9.5px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase;font-weight:700}

/* list rows */
.rowitem{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;background:var(--surf);
  border:1px solid var(--line);width:100%;text-align:left;transition:.15s;margin-bottom:9px;color:var(--txt)}
.rowitem:hover{border-color:var(--pri);transform:translateX(2px)}
.rowitem .ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--surf2)}
.rowitem .tx{flex:1;min-width:0}
.rowitem .tx b{display:block;font-size:14.2px;margin-bottom:2px}
.rowitem .tx span{font-size:11.8px;color:var(--dim);display:block;line-height:1.45}
.rowitem .go{color:var(--faint);font-size:16px;flex:none}
.rowitem.done .ic{background:var(--okS);color:var(--ok)}
.rowitem.lock{opacity:.55}

/* tiles */
.tile{padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surf);text-align:left;
  transition:.16s;position:relative;overflow:hidden;width:100%;color:var(--txt)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.tile .e{font-size:25px;display:block;margin-bottom:8px}
.tile b{display:block;font-size:14.5px;margin-bottom:3px}
.tile span{font-size:11.8px;color:var(--dim);line-height:1.45;display:block}
.tile .bar{margin-top:10px}

.stat{padding:13px 10px;border-radius:14px;background:var(--surf);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:20px;color:var(--pri)}
.stat span{font-size:10px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase;font-weight:700}

/* lesson content */
.prose{font-size:15px;line-height:1.75}
.prose p{margin:0 0 12px}
.prose h4{font-size:14.5px;margin:18px 0 8px;color:var(--pri)}
.prose ul,.prose ol{margin:0 0 12px;padding-left:20px}
.prose li{margin-bottom:7px}
.prose b{color:var(--txt)}
.prose em{color:var(--dim)}
.note{background:var(--priS);border-left:3px solid var(--pri);padding:12px 14px;border-radius:0 12px 12px 0;
  margin:12px 0;font-size:14px;line-height:1.65}
.note.a{background:var(--accS);border-color:var(--acc)}
.note.o{background:var(--okS);border-color:var(--ok)}
.note.b{background:var(--badS);border-color:var(--bad)}
.note b{display:block;margin-bottom:4px;font-size:13px;letter-spacing:.3px}
.passage{background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:15px 17px;
  font-size:14.6px;line-height:1.8;white-space:pre-wrap;margin:12px 0}
.passage h5{margin:0 0 8px;font-size:13px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase}

/* quiz */
.q{margin-bottom:14px}
.q .qt{font-size:15.4px;font-weight:600;line-height:1.55;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;border-radius:12px;background:var(--surf);
  border:1.6px solid var(--line);font-size:14.5px;line-height:1.45;text-align:left;width:100%;transition:.15s;color:var(--txt)}
.opt .k{width:24px;height:24px;flex:none;border-radius:7px;background:var(--surf2);display:grid;place-items:center;
  font-size:11.5px;font-weight:800;margin-top:1px}
.opt:hover{border-color:var(--pri)}
.opt.ok{background:var(--okS);border-color:var(--ok)}
.opt.no{background:var(--badS);border-color:var(--bad)}
.opt.rev{border-color:var(--ok)}
.fb{margin-top:10px;padding:12px 14px;border-radius:12px;font-size:13.6px;line-height:1.65;border:1px solid}
.fb.ok{background:var(--okS);border-color:rgba(16,185,129,.35)}
.fb.no{background:var(--badS);border-color:rgba(239,68,68,.3)}
.fb b{display:block;margin-bottom:3px}

/* audio player (listening) */
.player{background:var(--surf2);border:1px solid var(--line);border-radius:16px;padding:15px}
.player .ctl{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.playbtn{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 8px 20px var(--priS);transition:.15s}
.playbtn:active{transform:scale(.92)}
.playbtn.on{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--priS)}50%{box-shadow:0 0 0 14px transparent}}
.eq{display:flex;align-items:flex-end;gap:3px;height:26px;flex:1}
.eq i{flex:1;background:var(--pri);border-radius:2px;height:20%;opacity:.35}
.eq.on i{animation:eqa .9s ease-in-out infinite;opacity:1}
.eq.on i:nth-child(2n){animation-delay:.15s}
.eq.on i:nth-child(3n){animation-delay:.3s}
.eq.on i:nth-child(5n){animation-delay:.45s}
@keyframes eqa{0%,100%{height:18%}50%{height:100%}}

/* recorder */
.rec{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:28px;margin:0 auto;
  background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;box-shadow:0 10px 26px rgba(239,68,68,.3);transition:.15s}
.rec.on{animation:pulseR 1.2s infinite}
@keyframes pulseR{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 18px rgba(239,68,68,0)}}
.timer{font-size:38px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.timer.warn{color:var(--bad)}

/* flashcard */
.fcard{perspective:1200px;height:210px;margin:14px 0}
.fcard .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;cursor:pointer}
.fcard.flip .in{transform:rotateY(180deg)}
.fcard .f,.fcard .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:18px;display:grid;place-items:center;padding:22px;text-align:center;border:1px solid var(--line);box-shadow:var(--sh)}
.fcard .f{background:var(--surf)}
.fcard .b{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;transform:rotateY(180deg)}
.fcard .w{font-size:26px;font-weight:800;line-height:1.25}
.fcard .d{font-size:15px;line-height:1.6;margin-top:8px;opacity:.95}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:12px;background:var(--surf);
  border:1px solid var(--line);margin-bottom:7px;width:100%;text-align:left;font-size:13.8px;line-height:1.5;color:var(--txt)}
.chk .bx{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;
  font-size:12px;margin-top:1px;transition:.15s}
.chk.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.on{background:var(--okS);border-color:rgba(16,185,129,.3)}

/* overlay */
.ovl{position:fixed;inset:0;background:rgba(8,12,26,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:100;display:none;align-items:flex-end;justify-content:center;padding:0}
.ovl.on{display:flex}
.ovl .sheet{background:var(--surf);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:20px 18px calc(24px + var(--sb));animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){.ovl{align-items:center;padding:20px}.ovl .sheet{border-radius:22px;padding-bottom:22px}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}

#toast{position:fixed;left:50%;bottom:calc(88px + var(--sb));transform:translateX(-50%);z-index:120;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:440px}
@media(min-width:900px){#toast{bottom:26px}}
.tst{padding:12px 18px;border-radius:14px;background:var(--txt);color:var(--bg);font-size:13.5px;font-weight:700;
  box-shadow:var(--sh2);animation:up .25s;text-align:center}
#cv{position:fixed;inset:0;pointer-events:none;z-index:110}

/* certificate */
.cert{background:#fffdf7;color:#1a1a1a;border:10px double #b8912f;border-radius:6px;padding:30px 26px;text-align:center;
  font-family:Georgia,'Times New Roman',serif}
.cert h2{font-size:24px;letter-spacing:2px;color:#8a6d1f;margin-bottom:4px}
.cert .nm{font-size:30px;margin:16px 0 6px;border-bottom:1px solid #d8c9a0;display:inline-block;padding:0 20px 6px}
.cert p{font-size:13.5px;line-height:1.7;color:#3a3a3a}
.cert .sig{display:flex;justify-content:space-between;margin-top:26px;font-size:11px;color:#555}
.cert .sig div{border-top:1px solid #b8912f;padding-top:6px;width:44%}

@media print{
  .side,.tabbar,.top,.noprint{display:none!important}
  body{background:#fff}
  .pad{max-width:100%;padding:0}
  .card{box-shadow:none;border:none}
}
.skel{background:linear-gradient(90deg,var(--surf2) 25%,var(--line) 50%,var(--surf2) 75%);
  background-size:200% 100%;animation:sk 1.3s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="toast"></div>
<div class="app">

  <!-- ===== desktop sidebar ===== -->
  <aside class="side">
    <div class="brand" onclick="go('home')">
      <div class="mk">🎓</div>
      <div>
        <b>IGCSE Educational Platform</b>
        <small>English as a Second Language · 0510 / 0511</small>
      </div>
    </div>
    <button class="navb" data-v="home"     onclick="go('home')"><span class="i">🏠</span> Dashboard</button>
    <button class="navb" data-v="learn"    onclick="go('learn')"><span class="i">📚</span> Course</button>
    <button class="navb" data-v="practice" onclick="go('practice')"><span class="i">🎯</span> Skill Labs</button>
    <button class="navb" data-v="exams"    onclick="go('exams')"><span class="i">📝</span> Mock Exams</button>
    <button class="navb" data-v="me"       onclick="go('me')"><span class="i">👤</span> My Progress</button>

    <div class="navsec">Resources</div>
    <button class="navb" data-v="vocab"   onclick="go('vocab')"><span class="i">💡</span> Vocabulary Bank</button>
    <button class="navb" data-v="library" onclick="go('library')"><span class="i">🗂️</span> Model Answers</button>
    <button class="navb" data-v="game"    onclick="openGame()"><span class="i">🏆</span> Learning Game</button>

    <div class="navsec">School</div>
    <button class="navb" data-v="teacher" onclick="go('teacher')"><span class="i">👨‍🏫</span> Teacher Zone</button>
    <button class="navb" onclick="toggleTheme()"><span class="i" id="thIc">🌙</span> <span id="thTx">Dark mode</span></button>
    <button class="navb" onclick="openHelp()"><span class="i">❓</span> Help</button>

    <div style="flex:1"></div>
    <div class="tiny" style="padding:12px 13px;line-height:1.6">
      Designed by<br><b style="color:var(--dim)">Mr. Jibber Ahmed Mohammed</b><br>B.Ed · M.A · TKT · TESOL
    </div>
  </aside>

  <!-- ===== main ===== -->
  <main class="main">
    <div class="top">
      <div class="mk">🎓</div>

<script>
var BANK=[];
/* ===== GRAMMAR & STRUCTURE ===== */
BANK.push(
{t:"gram",tier:"core",type:"mcq",q:"My brother ____ football every Saturday morning.",o:["play","plays","is playing","played"],a:1,h:"Third person singular in the present simple.",e:"A repeated habit uses the present simple. With he/she/it we add -s: 'plays'."},
{t:"gram",tier:"core",type:"mcq",q:"Look! The bus ____ . Run!",o:["comes","come","is coming","came"],a:2,h:"Something happening at this very moment.",e:"'Look!' signals an action happening now, so we use the present continuous: 'is coming'."},
{t:"gram",tier:"core",type:"mcq",q:"I ____ my homework, so I can watch television now.",o:["finish","have finished","am finishing","was finishing"],a:1,h:"A past action with a present result.",e:"The present perfect links a finished action to the present result (I am free now)."},
{t:"gram",tier:"core",type:"mcq",q:"We ____ to Dubai last summer.",o:["have gone","go","went","are going"],a:2,h:"'Last summer' is a finished time.",e:"A finished past time expression ('last summer') needs the past simple: 'went'."},
{t:"gram",tier:"ext",type:"mcq",q:"By the time the ambulance arrived, the driver ____ the injured man out of the car.",o:["pulled","had pulled","was pulling","has pulled"],a:1,h:"Which action happened first?",e:"The past perfect ('had pulled') shows the action was completed before the other past action."},
{t:"gram",tier:"ext",type:"mcq",q:"This time next week I ____ on a beach in Zanzibar.",o:["will lie","will be lying","will have lain","am lying"],a:1,h:"An action in progress at a future moment.",e:"The future continuous describes an action in progress at a specific future time."},
{t:"gram",tier:"ext",type:"mcq",q:"By 2030 the company ____ more than a million trees.",o:["will plant","will have planted","plants","would plant"],a:1,h:"Completed *before* a future point.",e:"The future perfect ('will have planted') shows completion before a future deadline."},
{t:"gram",tier:"core",type:"mcq",q:"If it ____ tomorrow, we will cancel the trip.",o:["rains","will rain","rained","would rain"],a:0,h:"First conditional: if + present simple.",e:"First conditional = if + present simple, will + infinitive. Never 'will' in the if-clause."},
{t:"gram",tier:"ext",type:"mcq",q:"If I ____ you, I would apologise immediately.",o:["am","was","were","had been"],a:2,h:"Second conditional advice.",e:"'If I were you' is the standard second-conditional form for giving advice."},
{t:"gram",tier:"ext",type:"mcq",q:"If she had revised harder, she ____ the exam.",o:["would pass","will pass","would have passed","passed"],a:2,h:"Third conditional: regret about the past.",e:"Third conditional = if + past perfect, would have + past participle."},
{t:"gram",tier:"ext",type:"mcq",q:"Unless you hurry, you ____ the train.",o:["will miss","won't miss","would miss","missed"],a:0,h:"'Unless' already means 'if not'.",e:"'Unless' = 'if…not', so the main clause stays positive: 'you will miss the train'."},
{t:"gram",tier:"core",type:"mcq",q:"The classroom ____ every evening by the cleaners.",o:["cleans","is cleaned","is cleaning","cleaned"],a:1,h:"The classroom does not clean itself.",e:"Present simple passive: is/are + past participle."},
{t:"gram",tier:"ext",type:"mcq",q:"The new library ____ next March.",o:["will open","will be opened","is opening","opens"],a:1,h:"Someone opens it officially.",e:"Future passive: will be + past participle. The agent (the mayor) is unimportant."},
{t:"gram",tier:"ext",type:"mcq",q:"The results ____ already ____ to all the parents.",o:["have / sent","has / sent","have / been sent","are / sending"],a:2,h:"Present perfect + passive.",e:"Present perfect passive = have/has been + past participle."},
{t:"gram",tier:"ext",type:"mcq",q:"She said she ____ her project the following day.",o:["will finish","would finish","finishes","has finished"],a:1,h:"Reported speech moves tenses back.",e:"In reported speech 'will' becomes 'would' and 'tomorrow' becomes 'the following day'."},
{t:"gram",tier:"ext",type:"mcq",q:"He asked me where ____ .",o:["did I live","I lived","do I live","I did live"],a:1,h:"Reported questions use statement word order.",e:"Reported questions keep normal word order and drop the auxiliary 'did'."},
{t:"gram",tier:"core",type:"mcq",q:"'I am tired,' he said. → He said that he ____ tired.",o:["is","was","has been","will be"],a:1,h:"Shift the tense back one step.",e:"Present simple 'am' becomes past simple 'was' in reported speech."},
{t:"gram",tier:"core",type:"mcq",q:"You ____ wear a helmet when you ride a motorbike. It's the law.",o:["can","must","might","could"],a:1,h:"Strong legal obligation.",e:"'Must' expresses strong obligation, especially a rule or law."},
{t:"gram",tier:"core",type:"mcq",q:"You ____ bring your dictionary; there are plenty in the classroom.",o:["mustn't","don't have to","shouldn't","can't"],a:1,h:"No obligation ≠ prohibition.",e:"'Don't have to' = it is not necessary. 'Mustn't' would mean it is forbidden."},
{t:"gram",tier:"ext",type:"mcq",q:"She isn't answering. She ____ still be in the meeting.",o:["must","might","can","should"],a:1,h:"A possible explanation, not a certain one.",e:"'Might' expresses possibility. 'Must' would express near certainty."},
{t:"gram",tier:"ext",type:"mcq",q:"The lights are off, so they ____ have gone out.",o:["must","can","would","might not"],a:0,h:"A logical deduction based on evidence.",e:"'Must have + past participle' expresses a confident deduction about the past."},
{t:"gram",tier:"core",type:"mcq",q:"There isn't ____ sugar left in the jar.",o:["many","much","a few","several"],a:1,h:"Sugar is uncountable.",e:"'Much' is used with uncountable nouns in negatives and questions."},
{t:"gram",tier:"core",type:"mcq",q:"We only have ____ minutes before the bell rings.",o:["a little","much","a few","less"],a:2,h:"Minutes are countable.",e:"'A few' goes with countable plural nouns; 'a little' with uncountables."},
{t:"gram",tier:"core",type:"mcq",q:"I bought ____ umbrella because ____ sun was very strong.",o:["a / a","an / the","an / a","the / an"],a:1,h:"Listen to the first sound of 'umbrella'.",e:"'An' before a vowel sound; 'the' because there is only one sun."},
{t:"gram",tier:"core",type:"mcq",q:"My father is ____ engineer at ____ hospital near our house.",o:["a / a","an / a","an / the","the / a"],a:1,h:"Both are first mentions.",e:"'An engineer' (vowel sound), 'a hospital' (first mention, one of many)."},
{t:"gram",tier:"core",type:"mcq",q:"The meeting will start ____ 9 o'clock ____ Monday morning.",o:["in / on","at / on","on / at","at / in"],a:1,h:"Clock time vs day.",e:"'At' for clock times, 'on' for days and dates, 'in' for months and years."},
{t:"gram",tier:"core",type:"mcq",q:"She has been living in Nairobi ____ 2019.",o:["for","since","from","during"],a:1,h:"A starting point in time.",e:"'Since' + a point in time; 'for' + a length of time."},
{t:"gram",tier:"ext",type:"mcq",q:"He apologised ____ arriving late and thanked us ____ waiting.",o:["for / for","of / for","about / of","for / of"],a:0,h:"Both verbs take the same preposition here.",e:"Apologise FOR something; thank someone FOR something."},
{t:"gram",tier:"ext",type:"mcq",q:"The students were not interested ____ the topic and complained ____ the noise.",o:["in / about","on / of","in / of","at / about"],a:0,h:"Fixed verb + preposition patterns.",e:"Interested IN; complain ABOUT."},
{t:"gram",tier:"core",type:"mcq",q:"This is the man ____ helped us fix the tyre.",o:["which","who","whose","where"],a:1,h:"A person is the subject.",e:"'Who' introduces a relative clause about a person."},
{t:"gram",tier:"ext",type:"mcq",q:"The village ____ I was born has changed completely.",o:["which","that","where","who"],a:2,h:"Relative adverb of place.",e:"'Where' replaces 'in which' when referring to a place."},
{t:"gram",tier:"ext",type:"mcq",q:"My cousin, ____ lives in Cairo, is visiting us in July.",o:["that","who","which","whom"],a:1,h:"A non-defining clause after a comma.",e:"Non-defining relative clauses cannot use 'that'; for people use 'who'."},
{t:"gram",tier:"core",type:"mcq",q:"Mount Kilimanjaro is ____ mountain in Africa.",o:["the highest","highest","higher","more high"],a:0,h:"Comparing with all others.",e:"Superlatives take 'the' + -est for short adjectives."},
{t:"gram",tier:"core",type:"mcq",q:"This exercise is ____ difficult than the last one.",o:["more","most","much","the more"],a:0,h:"Comparing two things.",e:"Long adjectives form the comparative with 'more' + adjective + than."},
{t:"gram",tier:"ext",type:"mcq",q:"The film wasn't ____ interesting ____ I had expected.",o:["so / than","as / as","as / than","too / as"],a:1,h:"Equal comparison structure.",e:"'(not) as + adjective + as' compares two things."},
{t:"gram",tier:"core",type:"mcq",q:"I enjoy ____ novels in my free time.",o:["read","to read","reading","to reading"],a:2,h:"Which verbs take -ing?",e:"'Enjoy' is always followed by the -ing form."},
{t:"gram",tier:"core",type:"mcq",q:"She decided ____ a new laptop.",o:["buying","to buy","buy","bought"],a:1,h:"Which verbs take 'to'?",e:"'Decide' is followed by the full infinitive: decide to do."},
{t:"gram",tier:"ext",type:"mcq",q:"I don't mind ____ early, but I refuse ____ all night.",o:["getting up / working","to get up / working","getting up / to work","to get up / to work"],a:2,h:"Two different patterns in one sentence.",e:"'Mind' + -ing; 'refuse' + to + infinitive."},
{t:"gram",tier:"core",type:"mcq",q:"____ you ever ____ to a live concert?",o:["Did / go","Have / been","Have / gone","Are / going"],a:1,h:"Experience up to now.",e:"'Have you ever been…?' asks about life experience."},
{t:"gram",tier:"ext",type:"mcq",q:"She ____ for three hours when the rescue team finally found her.",o:["walked","has walked","had been walking","was walked"],a:2,h:"Duration before a past event.",e:"Past perfect continuous shows how long an action had lasted before another past action."},
{t:"gram",tier:"core",type:"mcq",q:"Neither of the answers ____ correct.",o:["are","is","were","have"],a:1,h:"'Neither' is singular.",e:"'Neither of' takes a singular verb in formal written English."},
{t:"gram",tier:"ext",type:"mcq",q:"The number of applicants ____ risen sharply this year.",o:["have","has","are","were"],a:1,h:"'The number' = one figure.",e:"'The number of…' is singular; 'a number of…' is plural."},
{t:"gram",tier:"core",type:"mcq",q:"Choose the correctly punctuated sentence.",o:["\"Where are you going\", she asked?","\"Where are you going?\" she asked.","Where are you going? \"she asked\".","\"Where are you going?\". She Asked."],a:1,h:"Where does the question mark belong?",e:"The question mark goes inside the speech marks; the reporting clause is lower case and ends with a full stop."},
{t:"gram",tier:"ext",type:"mcq",q:"Which sentence uses the apostrophe correctly?",o:["The student's bags were left in the hall (many students).","The students' bags were left in the hall.","The students bag's were left in the hall.","The student's bag's were left in the hall."],a:1,h:"Plural possession.",e:"For a plural noun ending in -s, the apostrophe goes after the s: students'."},
{t:"gram",tier:"core",type:"mcq",q:"Spot the error: 'She don't like waiting in long queues.'",o:["don't → doesn't","like → likes","waiting → to wait","queues → queue"],a:0,h:"Third person singular negative.",e:"With 'she' we use 'doesn't', not 'don't'."},
{t:"gram",tier:"core",type:"mcq",q:"Spot the error: 'We discussed about the problem for an hour.'",o:["discussed → discuss","remove 'about'","for → since","an → the"],a:1,h:"Some verbs need no preposition.",e:"'Discuss' is a transitive verb: we discuss something, not discuss about something."},
{t:"gram",tier:"ext",type:"mcq",q:"Spot the error: 'Despite of the rain, the match continued.'",o:["Despite of → Despite","continued → continue","the rain → rain","Add 'that'"],a:0,h:"'Despite' or 'in spite of'.",e:"Use 'despite + noun' or 'in spite of + noun' — never 'despite of'."},
{t:"gram",tier:"ext",type:"mcq",q:"Which linking word best completes the sentence? 'The scheme is expensive; ____, it saves lives.'",o:["therefore","however","moreover","for example"],a:1,h:"The two ideas contrast.",e:"'However' signals contrast; 'therefore' and 'moreover' add or conclude."},
{t:"gram",tier:"ext",type:"mcq",q:"'____ the heavy traffic, we still arrived on time.'",o:["Because of","Although","Despite","Even"],a:2,h:"What follows is a noun phrase.",e:"'Despite' + noun phrase shows contrast. 'Although' would need a clause with a verb."},
{t:"gram",tier:"core",type:"mcq",q:"There ____ a lot of people waiting outside the hall.",o:["is","was","were","has"],a:2,h:"'People' is plural.",e:"'People' takes a plural verb: there were."},
{t:"gram",tier:"ext",type:"mcq",q:"Hardly ____ the bell rung when the students rushed out.",o:["had","has","did","was"],a:0,h:"Inversion after a negative adverb.",e:"After 'hardly' at the start of a sentence we invert: Hardly had + subject + past participle."},
{t:"gram",tier:"core",type:"fill",q:"Complete with ONE word: 'She has been studying French ____ five years.'",ans:["for"],h:"A length of time.",e:"'For' + a period of time (five years); 'since' + a starting point."},
{t:"gram",tier:"core",type:"fill",q:"Complete with ONE word: 'If you heat ice, it ____ .' (melt)",ans:["melts"],h:"Zero conditional = general truth.",e:"The zero conditional uses the present simple in both clauses."},
{t:"gram",tier:"ext",type:"fill",q:"Rewrite in the passive using ONE word: 'Somebody has stolen my bag.' → My bag ____ been stolen.",ans:["has"],h:"Present perfect passive.",e:"Present perfect passive: has been + past participle."},
{t:"gram",tier:"core",type:"fill",q:"Complete with ONE word: 'He is much taller ____ his brother.'",ans:["than"],h:"After a comparative adjective.",e:"Comparatives are followed by 'than'."},
{t:"gram",tier:"ext",type:"fill",q:"Complete with ONE word: '____ the storm, all flights were cancelled.' (a preposition of reason)",ans:["due","because","owing"],h:"Two words are often used: 'due to', 'owing to'.",e:"'Due to / owing to / because of' + noun phrase express reason."},
{t:"gram",tier:"core",type:"order",q:"Put the words in the correct order:",a:"She has never been to Europe before",h:"Adverb of frequency goes after the auxiliary.",e:"'Never' sits between 'has' and 'been'."},
{t:"gram",tier:"core",type:"order",q:"Put the words in the correct order:",a:"How long have you been learning English",h:"Question word first, then the auxiliary.",e:"Question order: question word + auxiliary + subject + verb."},
{t:"gram",tier:"ext",type:"order",q:"Put the words in the correct order:",a:"Not only did he arrive late but he also forgot the tickets",h:"Inversion follows 'Not only'.",e:"After 'Not only' at the start we invert the auxiliary and subject."},
{t:"gram",tier:"ext",type:"order",q:"Put the words in the correct order:",a:"The report which was published yesterday caused a lot of debate",h:"Find the relative clause.",e:"The relative clause 'which was published yesterday' sits directly after the noun it describes."},
{t:"gram",tier:"core",type:"order",q:"Put the words in the correct order:",a:"I would rather stay at home tonight",h:"'Would rather' + bare infinitive.",e:"'Would rather' is followed by the infinitive without 'to'."},
{t:"gram",tier:"ext",type:"match",q:"Match each sentence half to the correct conditional ending:",pairs:[["If I see her, …","I'll give her your message."],["If I saw her, …","I'd give her your message."],["If I had seen her, …","I'd have given her your message."],["If you heat water to 100°C, …","it boils."]],h:"Look at the tense in the if-clause.",e:"First = present + will; second = past + would; third = past perfect + would have; zero = present + present."}
);

/* ===== VOCABULARY & WORD FORMATION ===== */
BANK.push(
{t:"vocab",tier:"core",type:"mcq",q:"The doctor advised him to ____ up smoking immediately.",o:["give","take","put","get"],a:0,h:"A phrasal verb meaning 'stop'.",e:"'Give up' = stop doing something, usually a habit."},
{t:"vocab",tier:"core",type:"mcq",q:"I need to ____ out these figures before the meeting.",o:["look","work","turn","bring"],a:1,h:"Calculate or solve.",e:"'Work out' = calculate, or find the solution to something."},
{t:"vocab",tier:"core",type:"mcq",q:"Please ____ after your little sister while I'm out.",o:["look","take","see","watch"],a:0,h:"Take care of.",e:"'Look after' = take care of someone or something."},
{t:"vocab",tier:"ext",type:"mcq",q:"The government has decided to ____ off the new tax until next year.",o:["put","take","call","set"],a:0,h:"Delay.",e:"'Put off' = postpone or delay."},
{t:"vocab",tier:"ext",type:"mcq",q:"The match was ____ off because of the flooded pitch.",o:["put","called","turned","given"],a:1,h:"Cancelled.",e:"'Call off' = cancel an arranged event."},
{t:"vocab",tier:"ext",type:"mcq",q:"Sales figures have ____ up sharply since the advertisement appeared.",o:["gone","made","looked","come"],a:0,h:"Increase.",e:"'Go up' = rise or increase."},
{t:"vocab",tier:"ext",type:"mcq",q:"It took her months to ____ over the disappointment.",o:["get","come","take","look"],a:0,h:"Recover from.",e:"'Get over' = recover from an illness, shock or disappointment."},
{t:"vocab",tier:"ext",type:"mcq",q:"We have completely ____ out of printer paper.",o:["run","gone","taken","made"],a:0,h:"Have none left.",e:"'Run out of' = have no more of a supply."},
{t:"vocab",tier:"core",type:"mcq",q:"He ____ up his father: they even walk the same way.",o:["takes after","looks after","puts up with","gets on with"],a:0,h:"Resemble a family member.",e:"'Take after' = resemble an older relative."},
{t:"vocab",tier:"ext",type:"mcq",q:"I don't know how she ____ that noise every night.",o:["puts up with","gets over","looks into","carries on"],a:0,h:"Tolerate.",e:"'Put up with' = tolerate something unpleasant."},
{t:"vocab",tier:"core",type:"mcq",q:"Which word means 'a person who travels to work every day'?",o:["passenger","commuter","tourist","pedestrian"],a:1,h:"Think about daily journeys to work.",e:"A commuter travels regularly between home and work."},
{t:"vocab",tier:"core",type:"mcq",q:"Which word means 'someone walking on foot in a street'?",o:["cyclist","commuter","pedestrian","driver"],a:2,h:"Not in a vehicle.",e:"A pedestrian is a person travelling on foot."},
{t:"vocab",tier:"ext",type:"mcq",q:"'The scheme was a resounding success.' The underlined word means…",o:["small but useful","extremely great","surprising","expensive"],a:1,h:"It intensifies 'success'.",e:"'Resounding' means very great or emphatic."},
{t:"vocab",tier:"ext",type:"mcq",q:"'Pollution levels have soared.' 'Soared' means…",o:["fallen slightly","stayed the same","risen very quickly","been measured"],a:2,h:"Think of a bird rising.",e:"'Soar' = rise rapidly to a high level."},
{t:"vocab",tier:"ext",type:"mcq",q:"'Attendance plummeted after the fee increase.' 'Plummeted' means…",o:["dropped suddenly","improved","doubled","recovered"],a:0,h:"The opposite of 'soared'.",e:"'Plummet' = fall very quickly and steeply."},
{t:"vocab",tier:"ext",type:"mcq",q:"'The evidence is compelling.' The writer means the evidence is…",o:["confusing","very convincing","incomplete","recent"],a:1,h:"It forces you to believe.",e:"'Compelling' = powerfully convincing."},
{t:"vocab",tier:"ext",type:"mcq",q:"'She gave a **concise** summary.' 'Concise' means…",o:["short and clear","long and detailed","unclear","spoken"],a:0,h:"Useful for summary writing!",e:"'Concise' = giving a lot of information in few words."},
{t:"vocab",tier:"core",type:"mcq",q:"Choose the best word: 'Recycling helps to ____ natural resources.'",o:["conserve","reserve","preserve jam","observe"],a:0,h:"Use carefully so they last.",e:"'Conserve' = protect and use resources carefully."},
{t:"vocab",tier:"core",type:"mcq",q:"Choose the best word: 'The charity ____ money for a new hospital wing.'",o:["raised","rose","lifted","grew"],a:0,h:"Raise something / rise by itself.",e:"'Raise' takes an object: raise money. 'Rise' has no object."},
{t:"vocab",tier:"ext",type:"mcq",q:"Choose the best word: 'The results had a serious ____ on students' confidence.'",o:["affect","effect","effort","affection"],a:1,h:"Noun or verb?",e:"'Effect' is the noun; 'affect' is the verb."},
{t:"vocab",tier:"core",type:"mcq",q:"Which is the odd one out?",o:["nurse","surgeon","paramedic","architect"],a:3,h:"Three belong to the same field.",e:"An architect designs buildings; the others work in healthcare."},
{t:"vocab",tier:"core",type:"mcq",q:"Which is the odd one out?",o:["drought","flood","earthquake","harvest"],a:3,h:"Three are disasters.",e:"A harvest is the gathering of crops, not a natural disaster."},
{t:"vocab",tier:"ext",type:"mcq",q:"Which is the odd one out?",o:["furthermore","in addition","moreover","nevertheless"],a:3,h:"Three add information.",e:"'Nevertheless' shows contrast; the others add a point."},
{t:"vocab",tier:"core",type:"mcq",q:"Which word is closest in meaning to 'enormous'?",o:["tiny","huge","narrow","rare"],a:1,h:"Size.",e:"'Enormous' = extremely large, i.e. huge."},
{t:"vocab",tier:"core",type:"mcq",q:"Which word is the OPPOSITE of 'temporary'?",o:["permanent","modern","brief","weak"],a:0,h:"Lasting forever.",e:"'Permanent' is the antonym of 'temporary'."},
{t:"vocab",tier:"ext",type:"mcq",q:"Which word is closest in meaning to 'reluctant'?",o:["eager","unwilling","careless","confident"],a:1,h:"Not keen to do something.",e:"'Reluctant' = hesitant or unwilling."},
{t:"vocab",tier:"ext",type:"mcq",q:"Which word is closest in meaning to 'inevitable'?",o:["avoidable","unavoidable","unexpected","unusual"],a:1,h:"It is certain to happen.",e:"'Inevitable' = certain to happen; impossible to avoid."},
{t:"vocab",tier:"core",type:"fill",q:"Word formation: 'The film was very ____ .' (BORE)",ans:["boring"],h:"Describe the film, not the person.",e:"-ing adjectives describe the thing; -ed adjectives describe how you feel."},
{t:"vocab",tier:"core",type:"fill",q:"Word formation: 'I was ____ by the news.' (SHOCK)",ans:["shocked"],h:"Describe the feeling.",e:"-ed adjectives describe the person's feeling: shocked."},
{t:"vocab",tier:"core",type:"fill",q:"Word formation: 'She gave a very ____ speech.' (POWER)",ans:["powerful"],h:"Adjective ending -ful.",e:"Noun 'power' → adjective 'powerful'."},
{t:"vocab",tier:"ext",type:"fill",q:"Word formation: 'The ____ of the bridge took two years.' (CONSTRUCT)",ans:["construction"],h:"Noun ending in -ion.",e:"Verb 'construct' → noun 'construction'."},
{t:"vocab",tier:"ext",type:"fill",q:"Word formation: 'His answer was completely ____ .' (RELEVANT)",ans:["irrelevant"],h:"Add a negative prefix.",e:"The prefix 'ir-' is used before words beginning with r: irrelevant."},
{t:"vocab",tier:"ext",type:"fill",q:"Word formation: 'The instructions were ____ , so nobody understood them.' (CLEAR)",ans:["unclear"],h:"Negative prefix 'un-'.",e:"'Unclear' = not clear."},
{t:"vocab",tier:"ext",type:"fill",q:"Word formation: 'We need a ____ solution to plastic waste.' (PERMANENT is wrong — use SUSTAIN)",ans:["sustainable"],h:"Adjective ending -able.",e:"Verb 'sustain' → adjective 'sustainable'."},
{t:"vocab",tier:"ext",type:"fill",q:"Word formation: 'She spoke ____ about her childhood.' (EMOTION)",ans:["emotionally"],h:"You need an adverb.",e:"emotion → emotional → emotionally (adverb describing 'spoke')."},

/* ===== READING & COMPREHENSION ===== */

{t:"read",tier:"core",type:"mcq",p:"The Kalahari Desert stretches across Botswana, Namibia and part of South Africa. Although it is called a desert, it receives between 100 and 500 mm of rain a year — enough for grasses and thorn trees to survive. For this reason many scientists prefer to call it a semi-desert.",q:"Why do some scientists avoid the word 'desert' for the Kalahari?",o:["It is not hot enough.","It receives enough rain for plants to grow.","It is too small to be a desert.","It crosses three countries."],a:1,h:"Scan for the word 'because' or 'for this reason'.",e:"The text says it gets 100–500 mm of rain, enough for vegetation — so 'semi-desert' is preferred."},
{t:"read",tier:"core",type:"mcq",p:"The Kalahari Desert stretches across Botswana, Namibia and part of South Africa. Although it is called a desert, it receives between 100 and 500 mm of rain a year — enough for grasses and thorn trees to survive.",q:"How much rain does the Kalahari receive each year?",o:["Under 100 mm","Between 100 and 500 mm","Exactly 500 mm","Over 1000 mm"],a:1,h:"Scanning for numbers is the fastest technique.",e:"Scanning means looking only for the figure — you do not need to read every word."},
{t:"read",tier:"ext",type:"mcq",p:"Nadia had trained for eleven months. Standing at the start line, she found that her hands would not stop shaking, yet she smiled at the crowd as though nothing at all was wrong.",q:"What does the writer suggest about Nadia?",o:["She was completely relaxed.","She was hiding her nervousness.","She had not prepared enough.","She disliked the crowd."],a:1,h:"Look at the contrast signalled by 'yet'.",e:"Her shaking hands show nerves; the smile 'as though nothing was wrong' shows she is hiding them. This is an inference question."},

{t:"read",tier:"core",type:"mcq",p:"Opening hours: Mon–Thu 09:00–17:00. Friday 09:00–13:00. Closed Saturdays. Sunday 10:00–16:00 (members only).",q:"When can a non-member visit on a weekend?",o:["Saturday morning","Sunday afternoon","They cannot visit at the weekend.","Friday afternoon"],a:2,h:"Read the small print carefully.",e:"Saturday is closed and Sunday is members only, so a non-member cannot visit at the weekend."},
{t:"read",tier:"core",type:"mcq",p:"Camp A: horse-riding, cooking, ages 8–12, weekends only.\nCamp B: coding and robotics, ages 13–16, full week.\nCamp C: swimming and sailing, ages 11–15, weekdays.\nCamp D: art and photography, ages 14–18, weekends.",q:"Layla is 15 and can only attend at the weekend. Which camp suits her?",o:["Camp A","Camp B","Camp C","Camp D"],a:3,h:"Check BOTH conditions: age and days.",e:"Multiple-matching questions always contain two or three conditions. Camp D fits ages 14–18 AND weekends."},

{t:"read",tier:"ext",type:"mcq",p:"For most of the twentieth century the river was treated as little more than a drain. Factories poured waste into it; the local council dumped rubbish on its banks. Today, after a fifteen-year clean-up, otters have returned.",q:"What is the writer's main purpose in this paragraph?",o:["To criticise modern factories","To contrast the river's past and present","To explain how otters live","To advertise the clean-up scheme"],a:1,h:"Notice the time markers.",e:"'For most of the twentieth century' … 'Today' signals a past/present contrast."},
{t:"read",tier:"ext",type:"mcq",p:"The scheme has been widely praised. It has, however, been criticised by some residents, who argue that the new cycle lanes have made deliveries far more difficult.",q:"Which phrase shows the writer is introducing an opposing view?",o:["has been widely praised","It has, however, been criticised","who argue that","far more difficult"],a:1,h:"Look for the discourse marker.",e:"'However' signals a change of direction to an opposing viewpoint."},

{t:"read",tier:"core",type:"fill",p:"The city introduced free bus travel for students in 2021. Within a year, the number of students cycling to school had fallen by 18%, while bus use had almost doubled.",q:"By what percentage did student cycling fall? Write the number and symbol.",ans:["18%","18 %","18 percent","eighteen percent"],h:"Scan for the figure.",e:"Short-answer questions want the shortest accurate answer — copy figures exactly."},
{t:"read",tier:"ext",type:"fill",p:"Ravi had queued since dawn. When the doors finally opened at ten, the last ticket had already been sold online.",q:"In ONE word, how would Ravi most likely feel? (adjective)",ans:["disappointed","frustrated","upset","angry","devastated","annoyed"],h:"He waited hours for nothing.",e:"Inference questions accept any sensible adjective supported by the text."},
{t:"read",tier:"ext",type:"mcq",p:"Critics of the plan claim it will cost jobs. Supporters counter that for every post lost in packaging, two will be created in recycling.",q:"What does the word 'counter' mean here?",o:["agree","reply with an opposing argument","count carefully","complain"],a:1,h:"Use the surrounding sentence to work it out.",e:"In the exam you must often guess vocabulary from context. 'Counter' = respond with an opposing point."},

{t:"read",tier:"ext",type:"mcq",p:"Electric scooters appeared on the city's streets almost overnight. Within six months, hospital admissions for head injuries among under-18s had risen by a third, prompting the council to introduce a compulsory helmet rule.",q:"What caused the council to act?",o:["Complaints from drivers","A rise in head injuries among young people","The cost of the scooters","A change in national law"],a:1,h:"Find the cause-and-effect link.",e:"'Prompting' signals cause and effect: the rise in injuries led to the rule."},

/* ===== SUMMARY & NOTE-MAKING ===== */
{t:"summ",tier:"core",type:"mcq",p:"Cycling to school keeps students fit, saves families money on fuel, and reduces traffic outside the gates. However, many parents worry about busy roads.",q:"Which is a BENEFIT of cycling to school according to the text?",o:["Parents worry about roads","It reduces traffic at the gates","Bicycles are expensive","Roads are busy"],a:1,h:"Benefits come before 'However'.",e:"Note-making questions ask you to sort information into the right column — benefits vs concerns."},
{t:"summ",tier:"core",type:"mcq",p:"Cycling to school keeps students fit, saves families money on fuel, and reduces traffic outside the gates. However, many parents worry about busy roads and the risk of bicycle theft.",q:"Which is a CONCERN, not a benefit?",o:["Students stay fit","Families save money","The risk of theft","Less traffic"],a:2,h:"Concerns follow 'However'.",e:"Discourse markers such as 'however' tell you the writer is switching category."},
{t:"summ",tier:"ext",type:"mcq",q:"Which sentence is the BEST summary of: 'Although the festival attracts thousands of visitors and brings money into local shops, residents complain about litter, noise and blocked streets.'?",o:["The festival is very popular with visitors.","The festival benefits the local economy but causes problems for residents.","Residents hate the festival.","The streets are blocked during the festival."],a:1,h:"A good summary includes BOTH sides.",e:"Summary answers must cover the main points, not one detail."},
{t:"summ",tier:"ext",type:"mcq",q:"Which of these should you NOT include in a summary?",o:["The main ideas","Your own opinion","Points from the whole text","Ideas in your own words"],a:1,h:"A summary reports; it does not judge.",e:"Never add opinions, examples or extra information to a summary."},
{t:"summ",tier:"ext",type:"mcq",q:"In the summary question you are told to write about 120 words. What happens if you write 200?",o:["You gain extra marks","You risk losing marks for irrelevance and poor language control","Nothing at all","The examiner stops at 120 and ignores the rest, and long answers usually contain copied text"],a:3,h:"Length control is part of the skill.",e:"Over-long answers usually copy from the text and lose language marks. Stay close to the word limit."},
{t:"summ",tier:"core",type:"mcq",q:"Which note is written in the best note form?",o:["The main reason that people give for not recycling is that they do not have enough space at home.","Main reason for not recycling: lack of space at home","People, who do not recycle, say that space is a problem for them.","No space."],a:1,h:"Notes are short but must be understandable.",e:"Good notes are brief phrases that still carry the full idea."},
{t:"summ",tier:"ext",type:"fill",p:"Solar panels cut electricity bills, produce no emissions while operating, and last for over twenty years. On the other hand, the initial cost is high and output falls sharply on cloudy days.",q:"Give ONE disadvantage of solar panels mentioned in the text (a few words).",ans:["high initial cost","the initial cost is high","expensive to install","high cost","output falls on cloudy days","less output when cloudy","cost is high"],h:"Look after 'On the other hand'.",e:"Either the high initial cost or reduced output on cloudy days is acceptable."},
{t:"summ",tier:"ext",type:"mcq",p:"Volunteering builds confidence, develops teamwork and looks impressive on a university application. Yet it takes up time that could be spent revising.",q:"Which is the best 'own words' version of 'looks impressive on a university application'?",o:["is impressive on applications to university","strengthens a university application","universities are impressed by applications","it looks good"],a:1,h:"Change the words, keep the meaning.",e:"Rephrasing (not copying) earns marks in the summary task."},
{t:"summ",tier:"ext",type:"order",q:"Put this summary sentence into order:",a:"The report suggests that recycling rates could be improved by clearer labelling",h:"Start with the reporting phrase.",e:"'The report suggests that…' is a useful summary opener."},
{t:"summ",tier:"core",type:"match",q:"Match each summary phrase to its function:",pairs:[["The main advantage is…","introducing a benefit"],["On the other hand,…","introducing a drawback"],["In addition,…","adding a similar point"],["Overall,…","giving a final conclusion"]],h:"These four phrases will structure any summary.",e:"Using clear signposting phrases makes a summary easy for the examiner to follow."},
{t:"summ",tier:"ext",type:"mcq",q:"You must summarise the DISADVANTAGES of tourism only. The text also lists advantages. What should you do?",o:["Include both to be safe","Include only disadvantages","Write two paragraphs, one for each","Copy the whole text"],a:1,h:"Read the question wording twice.",e:"Answering outside the question earns nothing and wastes time. Underline the focus word before you start."}

/* ===== WRITING: ARTICLE, REPORT & REVIEW (Paper 1, Exercise 6 style) ===== */
{t:"wart",tier:"core",type:"mcq",q:"You are writing an article for the school magazine. Which title is most engaging?",o:["Article about sport","Sport: Is Two Hours a Week Really Enough?","My views","Sport is good for you and everyone should do it in my school"],a:1,h:"A question in a title hooks the reader.",e:"Articles benefit from a short, punchy title — often a question."},
{t:"wart",tier:"ext",type:"mcq",q:"Which technique is MOST typical of a lively magazine article?",o:["Direct questions to the reader","Numbered technical data only","No paragraphs","Formal legal language"],a:0,h:"Articles talk to the reader.",e:"Rhetorical questions, direct address ('you') and anecdotes engage a magazine audience."},
{t:"wart",tier:"ext",type:"mcq",q:"A report for the head teacher should be…",o:["chatty and humorous","factual, organised and end with a recommendation","a personal story","a list of complaints"],a:1,h:"Purpose = to inform and advise.",e:"Reports use neutral language, clear sections and finish with recommendations."},
{t:"wart",tier:"ext",type:"mcq",q:"Which is the best closing sentence for a report?",o:["That's all from me!","In conclusion, I would recommend extending the library opening hours to 6 p.m.","So please do something about it.","I hope you liked my report."],a:1,h:"Reports end with a recommendation.",e:"'I would recommend…' is exactly what the examiner is looking for."},
{t:"wart",tier:"core",type:"mcq",q:"A review of a film or restaurant should include…",o:["only the plot","a description AND an opinion with a recommendation","only your opinion","only the price"],a:1,h:"Reviews balance information and judgement.",e:"A review describes, evaluates and then recommends (or does not) to the reader."},
{t:"wart",tier:"ext",type:"mcq",q:"Which sentence best shows a balanced view in an argumentative article?",o:["School uniform is completely pointless.","Although uniform can limit self-expression, it does reduce peer pressure over clothing.","Everybody hates uniform.","Uniform is good."],a:1,h:"Balance = concede then argue.",e:"Concession ('Although…') followed by your point shows mature argument and earns high Content marks."},

{t:"listen",tier:"ext",type:"mcq",q:"What should you do during the pause BEFORE a listening extract begins?",o:["Close your eyes","Read the questions and predict what to listen for","Write your name","Nothing"],a:1,h:"Preparation time is a gift.",e:"Reading ahead lets you predict the type of answer (a number? a place? a name?)."},

{t:"listen",tier:"ext",type:"match",q:"Match the signal phrase to what it tells you is coming:",pairs:[["To sum up,","a summary of the main point"],["On the contrary,","an opposite idea"],["For example,","an illustration"],["What's more,","an additional point"]],h:"Signposts guide listeners just like readers.",e:"Trained listeners follow discourse markers to predict what comes next."},

{t:"speak",tier:"core",type:"mcq",q:"In the speaking test you are assessed on structure, vocabulary and…",o:["handwriting","development and fluency","spelling","reading speed"],a:1,h:"It is a conversation, not a test of memory.",e:"The oral marks cover Structure, Vocabulary, and Development & Fluency."},
{t:"speak",tier:"ext",type:"mcq",q:"Which response best DEVELOPS the topic 'Technology in education'?",o:["Technology is good.","I think tablets help, for example our teacher shares videos we can rewatch at home, though I do worry about screen time.","Yes, it is.","I like phones."],a:1,h:"Opinion + example + a second angle.",e:"Development means adding examples, reasons and even a counter-idea."},

{t:"speak",tier:"core",type:"match",q:"Match the speaking function to a useful phrase:",pairs:[["giving an opinion","In my view, …"],["giving an example","Take my own school, for instance…"],["agreeing","That's exactly how I feel."],["hesitating naturally","Well, let me see…"]],h:"Learn one strong phrase per function.",e:"A small bank of functional phrases makes the oral far less stressful."},
{t:"speak",tier:"ext",type:"mcq",q:"You are given the topic card 'Living in a city'. What should you do in the preparation time?",o:["Write a full speech to read aloud","Note three or four ideas with examples","Memorise a paragraph","Nothing"],a:1,h:"It is a conversation, not a reading.",e:"Reading aloud sounds unnatural and loses fluency marks. Notes of ideas are far more useful."},
{t:"speak",tier:"core",type:"mcq",q:"Which is the best way to start your answer in a discussion?",o:["Silence for 20 seconds","Well, I think that…","I don't want to talk about this.","Repeat the question word for word."],a:1,h:"Start speaking quickly but naturally.",e:"A short lead-in phrase gets you talking while you organise your ideas."},
{t:"speak",tier:"ext",type:"order",q:"Put this speaking phrase in order:",a:"On the whole I would say that the advantages outweigh the disadvantages",h:"Start with the discourse marker.",e:"'On the whole' plus 'outweigh' is high-level oral language."},

/* ===== EXAM TECHNIQUE ===== */
{t:"exam",tier:"core",type:"mcq",q:"How do syllabus 0510 and syllabus 0511 differ?",o:["0511 has no writing","In 0510 the Speaking mark is endorsed separately; in 0511 it counts towards the overall grade","0510 is easier than 0511","0511 has no listening paper"],a:1,h:"The difference is only about the Speaking mark.",e:"0510 = Speaking Endorsement (the speaking grade is reported separately). 0511 = Count-in Speaking (speaking counts towards the overall grade). The teaching content is identical."},
{t:"exam",tier:"core",type:"mcq",q:"The question says 'Give TWO reasons'. You give three. What happens?",o:["Extra credit","Usually only the first two are marked — a wrong third can even cost you","Nothing","Automatic zero"],a:1,h:"Follow the instruction exactly.",e:"Answer exactly what is asked. Extra wrong material can cancel a correct answer."},
{t:"exam",tier:"ext",type:"mcq",q:"Best approach to a reading text you find difficult?",o:["Read every word slowly from the start","Read the questions first, then skim the text for the relevant sections","Give up and guess","Copy long sections into your answers"],a:1,h:"Let the questions guide you.",e:"Question-first reading focuses your attention and saves time."},
{t:"exam",tier:"core",type:"mcq",q:"You have five minutes left and one long answer unfinished. What is best?",o:["Leave it blank","Write brief but clear points covering the remaining content","Rewrite what you already wrote","Ask for more time"],a:1,h:"Content marks are still available.",e:"Partial answers score partial marks; blanks score none."},
{t:"exam",tier:"ext",type:"mcq",q:"When you copy a word from the passage into a short answer, what is the main risk?",o:["It is always wrong","You may copy the wrong grammatical form or too much text","Copying is banned","It takes too long"],a:1,h:"Copy accurately but selectively.",e:"Copy exact key words for short answers, but never copy whole sentences into a summary."},
{t:"exam",tier:"core",type:"mcq",q:"In multiple-matching tasks, the fastest reliable method is to…",o:["read all texts fully, then all questions","underline the key conditions in each question, then scan the texts","guess","start at the last text"],a:1,h:"Conditions first.",e:"Underlining the conditions (age, day, cost, interest) turns matching into a checklist."},
{t:"exam",tier:"ext",type:"mcq",q:"Which spelling would lose a mark in a short-answer question?",o:["definately","definitely","necessary","separate"],a:0,h:"One of these is misspelt.",e:"'Definitely' — a very common misspelling. Keep a personal error list."},
{t:"exam",tier:"ext",type:"mcq",q:"What is the most useful thing to do in the last 5 minutes of the writing paper?",o:["Add another paragraph","Check verb endings, articles, plurals and punctuation","Count words again","Rewrite the introduction"],a:1,h:"Target your usual errors.",e:"A focused proof-read of your known weak points recovers real marks."},
{t:"exam",tier:"core",type:"mcq",q:"Your answer must be 'in your own words'. What does this mean?",o:["Invent new information","Rephrase the ideas from the text using different wording","Translate into your language","Copy exactly"],a:1,h:"Same idea, different words.",e:"Paraphrasing shows understanding; copying shows only that you can find the line."},
{t:"exam",tier:"ext",type:"match",q:"Match each paper of the current 0510/0511 syllabus to what it tests:",pairs:[["Paper 1","Reading and Writing (2 hours)"],["Paper 2","Listening (about 50 minutes)"],["Paper 3","Speaking (10\u201315 minutes)"],["Exercise 6 of Paper 1","An extended piece of writing"]],h:"There are three papers, not four.",e:"In the 2024\u20132026 syllabus there are three components: Paper 1 Reading and Writing, Paper 2 Listening and Paper 3 Speaking. Always confirm the details for your own examination series."},

{id:"u1",t:"Welcome to the Course",sub:"How the exam works and how to beat it",ic:"🚀",lessons:[

{id:"u1l1",t:"How your English is assessed",m:8,
obj:["Name the three papers and what each one tests","Explain the difference between 0510 and 0511"],
html:`<p>Before you learn anything else, understand the shape of the examination. Students who know what is coming make far fewer avoidable mistakes.</p>
<h4>The three papers</h4>
<ul>
<li><b>Paper 1 — Reading and Writing.</b> 2 hours, 60 marks. Six exercises: four reading and two writing.</li>
<li><b>Paper 2 — Listening.</b> About 50 minutes, 40 marks, five exercises. Every recording is played <b>twice</b>.</li>
<li><b>Paper 3 — Speaking.</b> 10–15 minutes: a warm-up interview, a short talk from a topic card, then a discussion. Your own teacher assesses it and Cambridge moderates.</li>
</ul>
<div class="note"><b>0510 or 0511?</b>The teaching is identical. In <b>0510</b> the speaking grade is reported separately (a "Speaking Endorsement"). In <b>0511</b> speaking <b>counts towards your overall grade</b> — so if you are on 0511, every minute you spend speaking English is worth real marks.</div>
<h4>What examiners actually reward</h4>
<p>Not perfection. They reward <b>successful communication</b>: answering exactly what was asked, using a range of language accurately enough to be clear, and organising ideas so a reader can follow them.</p>
<div class="note a"><b>Common myth</b>Longer answers are not better answers. Over-writing adds errors and irrelevance, and it costs marks in both Content and Language.</div>
<h4>There are no tiers any more</h4>
<p>Cambridge removed Core and Extended tiering from 0510 and 0511. Every candidate now sits the same papers. The <b>Standard</b> and <b>Higher</b> levels used on this platform are practice settings only — use Higher to stretch yourself.</p>`,

{id:"u1l2",t:"How to use this platform",m:6,
obj:["Plan a weekly study routine","Know which section to use for each skill"],
html:`<p>This platform has four kinds of activity. Using all four is what produces a grade improvement; using only quizzes will not.</p>
<h4>The four parts</h4>
<ul>
<li><b>📚 Course</b> — the teaching. Read a lesson, then answer the check questions. This is where you learn <i>how</i> to do something.</li>
<li><b>🎯 Skill Labs</b> — the practice. Reading passages, listening extracts you can play aloud, a speaking studio that records your voice, and a writing studio with model answers.</li>
<li><b>📝 Mock Exams</b> — timed papers under real conditions.</li>
<li><b>💡 Vocabulary Bank</b> — flashcards that bring words back just before you forget them.</li>
</ul>
<div class="note o"><b>A routine that works</b>Twenty minutes a day beats three hours on Sunday. Try: one lesson (Monday), one reading passage (Tuesday), one listening (Wednesday), one speaking recording (Thursday), one piece of writing (Friday), flashcards every single day.</div>
<h4>Your progress is saved</h4>
<p>Everything is stored on the device you are using. There is no login and nothing is sent anywhere. If you switch phones, use the backup button in <b>My Progress</b>.</p>`,
